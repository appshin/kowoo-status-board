<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOWOO THAI 설비 가동현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
:root{
  --ink:#15181d; --graphite:#1c2128; --paper:#f3f2ee; --paper-2:#ffffff;
  --amber:#e8892f; --amber-dim:#c76f1e;
  --run:#3f9d5e; --run-bg:#e3f3e6;
  --setup:#c98a1f; --setup-bg:#faf1de;
  --stop:#9aa0a8; --stop-bg:#eceae5;
  --nodata:#c2beb4; --nodata-bg:#f5f3ee;
  --stale:#d5533f;
  --muted:#8b93a1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',monospace;}
.disp{font-family:'Space Grotesk',sans-serif;}

header{
  background:linear-gradient(180deg,var(--graphite),var(--ink));color:#fff;
  padding:16px 20px;position:sticky;top:0;z-index:10;
}
header .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
header h1{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0;}
header .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase;}
nav{display:flex;gap:6px;}
nav button{all:unset;cursor:pointer;padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;color:#c4cad3;border:1px solid #3a4453;}
nav button.active{background:var(--amber);color:#1c1200;border-color:var(--amber);}

#main{padding:20px;max-width:1400px;margin:0 auto;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;color:#555;align-items:center;}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
select,input[type=text],input[type=url]{font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:7px 10px;border-radius:7px;border:1px solid #d6d2c8;background:#fff;color:var(--ink);}
button.btn{font-family:'Noto Sans KR',sans-serif;font-weight:600;font-size:13px;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;background:var(--amber);color:#241600;}
button.btn:hover{background:var(--amber-dim);}
button.btn.ghost{background:transparent;border:1px solid #d6d2c8;color:#444;}
button.btn.ghost:hover{background:#efece5;}
button.btn.small{padding:6px 11px;font-size:12px;}

.bgroup{margin-bottom:26px;}
.bgroup h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 10px 0;display:flex;align-items:center;gap:8px;}
.bgroup h2 .cnt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#999;font-weight:400;}

.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.eq-card{
  border-radius:11px;padding:12px 13px;cursor:pointer;border:1.5px solid transparent;
  background:var(--nodata-bg);transition:transform .1s;
}
.eq-card:hover{transform:translateY(-1px);}
.eq-card.run{background:var(--run-bg);border-color:#bfe2c7;}
.eq-card.setup{background:var(--setup-bg);border-color:#ecd9a8;}
.eq-card.stop{background:var(--stop-bg);border-color:#d8d5cd;}
.eq-card.nodata{background:var(--nodata-bg);border-color:#e3e0d8;}
.eq-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.eq-card .eqid{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;}
.eq-card .status-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;margin-top:3px;}
.status-dot.run{background:var(--run);}
.status-dot.setup{background:var(--setup);}
.status-dot.stop{background:var(--stop);}
.status-dot.nodata{background:var(--nodata);}
.eq-card .eqname{font-size:10.5px;color:#666;margin-bottom:6px;line-height:1.3;min-height:26px;}
.eq-card .prod{font-size:12px;font-weight:600;line-height:1.3;}
.eq-card .meta{font-size:10px;color:#999;margin-top:6px;font-family:'IBM Plex Mono',monospace;}
.eq-card .stale{color:var(--stale);font-weight:700;}

/* input form */
.card{background:var(--paper-2);border:1px solid #e3e1da;border-radius:12px;padding:20px;max-width:520px;margin:0 auto;}
.card h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 4px 0;}
.card .sub{font-size:12.5px;color:#7c8493;margin-bottom:18px;font-family:'IBM Plex Mono',monospace;}
.status-choice{display:flex;gap:8px;margin-bottom:16px;}
.status-choice button{
  all:unset;cursor:pointer;flex:1;text-align:center;padding:14px 8px;border-radius:10px;
  border:1.5px solid #e3e1da;font-weight:700;font-size:13px;
}
.status-choice button.sel-run{border-color:var(--run);background:var(--run-bg);color:var(--run);}
.status-choice button.sel-setup{border-color:var(--setup);background:var(--setup-bg);color:var(--setup);}
.status-choice button.sel-stop{border-color:var(--stop);background:var(--stop-bg);color:#666;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:#7c8493;margin-bottom:5px;font-family:'IBM Plex Mono',monospace;}
.field select,.field input{width:100%;padding:10px 12px;font-size:14px;}
.submit-row{display:flex;gap:10px;margin-top:18px;}
.submit-row button{flex:1;padding:13px;font-size:14px;}
#confirmMsg{text-align:center;padding:40px 20px;}
#confirmMsg .big{font-size:40px;margin-bottom:10px;}

/* QR page */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.qr-cell{background:#fff;border:1px solid #e3e1da;border-radius:10px;padding:12px;text-align:center;}
.qr-cell .qrimg{margin:0 auto 8px auto;}
.qr-cell .eqid{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;}
.qr-cell .eqname{font-size:9.5px;color:#777;margin-top:2px;line-height:1.25;}

@media print{
  header,.toolbar,.legend,#qrToolbar{display:none !important;}
  body{background:#fff;}
  .qr-cell{break-inside:avoid;border:1px solid #999;}
}
#toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
#toast.show{opacity:1;}
.hidden{display:none !important;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:#fff;border-radius:14px;padding:32px 28px;max-width:360px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08);}
.login-card h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 4px 0;}
.login-card .sub{font-size:12px;color:#8b93a1;margin-bottom:22px;font-family:'IBM Plex Mono',monospace;}
.login-card input{width:100%;padding:11px 13px;margin-bottom:12px;border-radius:8px;border:1px solid #d6d2c8;font-size:14px;}
.login-card button{width:100%;padding:12px;margin-top:6px;}
.login-err{color:var(--stale);font-size:12.5px;margin-top:10px;min-height:16px;}
.userbar{font-size:11px;color:#9aa3ad;display:flex;align-items:center;gap:8px;}
.userbar button{all:unset;cursor:pointer;color:var(--amber);text-decoration:underline;font-size:11px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#c9c5ba;border-radius:6px;}
</style>
</head>

    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <nav id="nav"></nav>
      <div class="userbar" id="userbar"></div>
    </div>
  </div>
</header>
<div id="main"></div>
<div id="toast"></div>

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function fmtAgo(ts){
  if(!ts) return '기록 없음';
  const diffMs = Date.now() - ts;
  const min = Math.floor(diffMs/60000);
  if(min < 1) return '방금 전';
  if(min < 60) return `${min}분 전`;
  const hr = Math.floor(min/60);
  if(hr < 24) return `${hr}시간 전`;
  return `${Math.floor(hr/24)}일 전`;
}
function isStale(ts, hours=4){
  if(!ts) return false;
  return (Date.now()-ts) > hours*3600*1000;
}
function safeKey(key){
  // Firebase RTDB paths can't contain . # $ [ ] /
  return key.replace(/[.#$/\[\]]/g, '_');
}

// ---------- Storage (Firebase Realtime Database) ----------
async function loadStatus(key){
  if(!db) return null;
  try{
    const snap = await db.ref('eqstatus/'+safeKey(key)).once('value');
    return snap.exists() ? snap.val() : null;
  }catch(e){ console.error(e); return null; }
}
async function loadAllStatus(){
  if(!db) return {};
  try{
    const snap = await db.ref('eqstatus').once('value');
    const raw = snap.exists() ? snap.val() : {};
    const out = {};
    EQUIP.forEach(e=>{ out[e.qrid] = raw[safeKey(e.qrid)] || null; });
    return out;
  }catch(e){ console.error(e); return {}; }
}
async function saveStatus(key, data){
  if(!db) return false;
  try{
    await db.ref('eqstatus/'+safeKey(key)).set(data);
    return true;
  }catch(e){ console.error(e); return false; }
}
function watchAllStatus(callback){
  if(!db) return ()=>{};
  const ref = db.ref('eqstatus');
  const handler = (snap)=>{
    const raw = snap.exists() ? snap.val() : {};
    const out = {};
    EQUIP.forEach(e=>{ out[e.qrid] = raw[safeKey(e.qrid)] || null; });
    callback(out);
  };
  ref.on('value', handler);
  return ()=>ref.off('value', handler);
}

    if(!email || !pw){ errEl.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }
    try{
      await auth.signInWithEmailAndPassword(email, pw);
    }catch(e){
      errEl.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';
    }
  };
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('loginPw').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doLogin(); });
}

function renderUserbar(){
  const bar = document.getElementById('userbar');
  if(!bar || !currentUser) return;
  bar.innerHTML = `<span>${currentUser.email}</span><button id="logoutBtn">로그아웃</button>`;
  document.getElementById('logoutBtn').onclick = ()=>auth.signOut();
}

async function render(){
  if(!FIREBASE_CONFIGURED){
    document.getElementById('nav').innerHTML = '';
    document.getElementById('main').innerHTML = `
      <div class="card" style="max-width:640px;">
        <h2>⚠ Firebase 설정이 필요합니다</h2>
        <p style="font-size:13px;line-height:1.7;color:#555;">
        app.js 상단의 <code>firebaseConfig</code> 값이 아직 예시값(YOUR_API_KEY 등)입니다.
        Firebase 콘솔에서 프로젝트를 만들고 Realtime Database를 켠 뒤, 나오는 설정값을 그대로 붙여넣어주세요.
        이 값을 넣기 전까지는 저장/조회가 되지 않습니다.</p>
      </div>`;
    return;
  }
  if(!currentUser){
    renderLogin();
    return;
  }
  renderUserbar();
  const eqKey = getEqParam();
  if(eqKey){
    renderInputPage(eqKey);
    return;
  }
  renderNav();
  const main = document.getElementById('main');
  if(currentPage==='dash') await renderDash(main);
  else if(currentPage==='qr') renderQr(main);
  else if(currentPage==='prodqr') renderProductQr(main);
}

// ---------- Dashboard ----------
let dashUnsub = null;
async function renderDash(main){
  main.innerHTML = `<div class="legend" id="legend"></div><div id="dashBody">불러오는 중...</div>`;
  document.getElementById('legend').innerHTML = `
    <span><span class="dot" style="background:var(--run);"></span>가동중</span>
    <span><span class="dot" style="background:var(--setup);"></span>셋업/교체중</span>
    <span><span class="dot" style="background:var(--stop);"></span>정지</span>
    <span><span class="dot" style="background:var(--nodata);"></span>보고 없음</span>
    <span style="color:var(--stale);font-weight:700;">⚠ 4시간 이상 업데이트 없음 = 정보 오래됨</span>
    <span style="margin-left:auto;color:var(--run);font-size:11px;">● 실시간 연결됨</span>
  `;

  function paint(){
    const body = document.getElementById('dashBody');
    if(!body) return;
    body.innerHTML = BUILDINGS.map(b=>{
      const items = EQUIP.filter(e=>e.building===b);
      const runCount = items.filter(e=>statusCache[e.qrid]?.status==='run').length;
      return `
        <div class="bgroup">
          <h2>${b} <span class="cnt">${runCount}/${items.length}대 가동중</span></h2>
          <div class="eq-grid">
            ${items.map(e=>renderEqCard(e)).join('')}
          </div>
        </div>
      `;
    }).join('');
    body.querySelectorAll('.eq-card').forEach(el=>{
      el.onclick = ()=>{
        const key = el.dataset.key;
        history.pushState(null,'', `?eq=${encodeURIComponent(key)}`);
        renderInputPage(key);
      };
    });
  }

  statusCache = await loadAllStatus();
  paint();

  // live updates via Firebase listener (replaces polling)
  if(dashUnsub) dashUnsub();
  dashUnsub = watchAllStatus((data)=>{
    statusCache = data;
    if(currentPage==='dash' && !getEqParam()) paint();
  });
}

function renderEqCard(e){
  const s = statusCache[e.qrid];
  const status = s?.status || 'nodata';
  const stale = s && isStale(s.ts);
  const label = {run:'가동중', setup:'셋업/교체중', stop:'정지', nodata:'보고 없음'}[status];
  return `
    <div class="eq-card ${status}" data-key="${e.qrid}">
      <div class="top">
        <div class="eqid">${e.qrid}${e.qrid_confirmed?"":'<span style="color:var(--stale);font-size:9px;margin-left:4px;">'+(e.qrid.includes("임시")?"[임시번호]":"[확인필요]")+"</span>"}</div>
        <div class="status-dot ${status}"></div>
      </div>
      <div class="eqname">${e.eqname}</div>
      <div class="prod">${s?.product ? s.product : label}</div>
      <div class="meta ${stale?'stale':''}">${s?fmtAgo(s.ts):'-'} ${stale?'⚠':''}</div>
    </div>
  `;
}

// ---------- Input (scan) page ----------
let inputChoice = null;
async function renderInputPage(key){
  const e = EQUIP.find(x=>x.qrid===key);
  const main = document.getElementById('main');
  document.getElementById('nav') && (document.getElementById('nav').innerHTML='');
  if(!e){
    main.innerHTML = `<div class="card"><h2>설비를 찾을 수 없습니다</h2><p>${key}</p><button class="btn ghost" onclick="location.href=location.pathname">대시보드로</button></div>`;
    return;
  }
  const existing = await loadStatus(key);
  inputChoice = existing?.status || null;

  main.innerHTML = `
    <div class="card">
      <h2>${e.eqname}</h2>
      <div class="sub">${e.building} · 설비번호 ${e.qrid}${e.qrid_confirmed?"":" (확정 전 임시값)"}</div>
      <div class="status-choice" id="statusChoice">
        <button data-v="run" class="${inputChoice==='run'?'sel-run':''}">🟢 가동중</button>
        <button data-v="setup" class="${inputChoice==='setup'?'sel-setup':''}">🟡 셋업/교체중</button>
        <button data-v="stop" class="${inputChoice==='stop'?'sel-stop':''}">⚪ 정지</button>
      </div>
      <div class="field" id="prodField">
        <label>작업 품목</label>
        <select id="prodSel">
          <option value="">선택 안 함</option>
          <optgroup label="이 설비 관련 품목">
          ${e.products.map(p=>`<option value="${p}" ${existing?.product===p?'selected':''}>${p}</option>`).join('')}
          </optgroup>
          <optgroup label="전체 품목 목록 (코우타이 생산품목)">
          ${PRODUCTS.map(p=>`<option value="${p.label}" ${existing?.product===p.label?'selected':''}>${p.label}</option>`).join('')}
          </optgroup>
          <option value="__other__" ${existing?.product && !e.products.includes(existing.product) && !PRODUCTS.some(p=>p.label===existing.product)?'selected':''}>기타(직접입력)</option>
        </select>
        <button class="btn ghost small" id="scanProdBtn" style="margin-top:8px;">📷 QR로 품목 스캔</button>
      </div>
      <div class="field hidden" id="otherField">
        <label>품목명 직접입력</label>
        <input type="text" id="otherInput" value="${existing?.product && !e.products.includes(existing.product) && !PRODUCTS.some(p=>p.label===existing.product)?existing.product:''}">
      </div>
      <div class="field">
        <label>비고</label>
        <input type="text" id="noteInput" value="${existing?.note||''}" placeholder="예: 금형교체 중, 15시 재가동 예정">
      </div>
      <div class="submit-row">
        <button class="btn" id="submitBtn">저장</button>
        <button class="btn ghost" id="backBtn">대시보드</button>
      </div>
    </div>
  `;

  document.querySelectorAll('#statusChoice button').forEach(b=>{
    b.onclick = ()=>{
      inputChoice = b.dataset.v;
      document.querySelectorAll('#statusChoice button').forEach(x=>x.className='');
      b.className = 'sel-'+inputChoice;
    };
  });
  const prodSel = document.getElementById('prodSel');
  const otherField = document.getElementById('otherField');
  function syncOther(){ otherField.classList.toggle('hidden', prodSel.value!=='__other__'); }
  prodSel.onchange = syncOther;
  syncOther();

  document.getElementById('scanProdBtn').onclick = ()=>{
    startProductScan((data)=>{
      if(!data.startsWith(PROD_TAG)){
        toast('품목 QR이 아닙니다. 품목 QR코드를 스캔해주세요.');
        return;
      }
      const label = data.slice(PROD_TAG.length);
      const match = [...prodSel.options].find(o=>o.value===label);
      if(match){
        prodSel.value = label;
        toast('품목이 인식되었습니다: ' + label);
      } else {
        prodSel.value = '__other__';
        document.getElementById('otherInput').value = label;
        toast('목록에 없는 품목입니다 - 직접입력에 채워넣었습니다.');
      }
      syncOther();
    });
  };

  document.getElementById('backBtn').onclick = ()=>{ location.href = location.pathname; };
  document.getElementById('submitBtn').onclick = async ()=>{
    if(!inputChoice){ toast('상태를 선택해주세요.'); return; }
    let product = prodSel.value;
    if(product==='__other__') product = document.getElementById('otherInput').value.trim();
    const data = {
      status: inputChoice,
      product: product || null,
      note: document.getElementById('noteInput').value.trim(),
      ts: Date.now()
    };
    const ok = await saveStatus(key, data);
    if(ok){
      main.innerHTML = `<div class="card"><div id="confirmMsg"><div class="big">✅</div><div style="font-weight:700;font-size:16px;">저장되었습니다</div>
        <div style="color:#888;font-size:13px;margin-top:6px;">${e.qrid} · ${ {run:'가동중',setup:'셋업/교체중',stop:'정지'}[inputChoice] }</div>
        <button class="btn ghost" style="margin-top:20px;" onclick="location.href=location.pathname">대시보드로</button>
      </div></div>`;
    } else {
      toast('저장 실패 - 다시 시도해주세요.');
    }
  };
}

// ---------- QR management ----------
function getBaseUrl(){
  return localStorage.getItem('kowoo_qr_baseurl') || (location.origin + location.pathname);
}
function renderQr(main){
  main.innerHTML = '';
  const base = getBaseUrl();
  main.innerHTML = `
    <div class="toolbar" id="qrToolbar">
      <label class="mono" style="font-size:11.5px;color:#7c8493;">배포 URL (이 화면이 실제로 열리는 주소)</label>
      <input type="url" id="baseUrlInput" style="width:380px;" value="${getBaseUrl()}" placeholder="https://...">
      <button class="btn ghost small" id="saveUrlBtn">저장</button>
      <button class="btn small" id="printBtn">전체 인쇄</button>
    </div>
    <p style="font-size:12px;color:#7c8493;margin:-6px 0 6px 0;">이 웹을 배포(공유)한 실제 주소를 위에 입력하면, 그 주소 기준으로 설비별 QR코드가 생성됩니다. QR을 인쇄해서 각 설비에 부착하면, 작업자가 폰 카메라로 스캔했을 때 바로 그 설비의 입력화면이 열립니다.</p>
    <p style="font-size:12px;color:var(--stale);margin:0 0 6px 0;">⚠ 번호 옆 [확인필요]/[임시번호] 표시가 있는 설비는 현장 확인 후 실제 번호로 교체가 필요합니다 (F2/F3 "148"번 중복 1건, F2 "23"번 중복 2건, F3 번호 미상 6건).</p>
    ${base.startsWith('file://') ? '<p style="font-size:12.5px;color:#fff;background:var(--stale);padding:8px 12px;border-radius:8px;margin:0 0 16px 0;"><b>⚠ 지금 배포 URL이 내 컴퓨터 파일 경로(file:///...)입니다.</b> 이 상태로 QR을 인쇄하면 다른 사람 폰에서는 절대 안 열립니다 — 반드시 인터넷에서 접속 가능한 https:// 주소(예: 이 아티팩트의 공유 링크, 또는 사내 웹서버 주소)로 바꿔서 저장해주세요.</p>' : ''}
    <div id="qrGrid"></div>
  `;
  document.getElementById('saveUrlBtn').onclick = ()=>{
    localStorage.setItem('kowoo_qr_baseurl', document.getElementById('baseUrlInput').value.trim());
    toast('저장되었습니다. QR을 다시 생성합니다.');
    renderQr(main);
  };
  document.getElementById('printBtn').onclick = ()=>window.print();

  const grid = document.getElementById('qrGrid');
  grid.innerHTML = BUILDINGS.map(b=>{
    const items = EQUIP.filter(e=>e.building===b);
    return `
      <div class="bgroup">
        <h2>${b} <span class="cnt">${items.length}대</span></h2>
        <div class="qr-grid">
        ${items.map(e=>`
          <div class="qr-cell">
            <div class="qrimg" id="qr-${e.qrid}"></div>
            <div class="eqid">${e.qrid}${e.qrid_confirmed?"":'<span style="color:var(--stale);font-size:9px;display:block;margin-top:2px;">'+(e.qrid.includes("임시")?"[임시번호]":"[확인필요]")+"</span>"}</div>
          </div>
        `).join('')}
        </div>
      </div>
    `;
  }).join('');

  EQUIP.forEach(e=>{
    const url = `${base}${base.includes('?')?'&':'?'}eq=${encodeURIComponent(e.qrid)}`;
    const el = document.getElementById(`qr-${e.qrid}`);
    QRCode.toDataURL(url, {width:120, margin:1, errorCorrectionLevel:'M'}, function(err, dataUrl){
      if(err){
        console.error('QR gen failed for', e.qrid, err);
        if(el) el.innerHTML = '<div style="font-size:10px;color:var(--stale);padding:10px;">QR 생성 실패</div>';
        return;
      }
      if(el) el.innerHTML = `<img src="${dataUrl}" width="120" height="120" alt="QR">`;
    });
  });
}

// ---------- Product QR ----------
const PROD_TAG = 'KOWOO-PRODUCT::';
function renderProductQr(main){
  main.innerHTML = `
    <div class="toolbar">
      <button class="btn small" id="printBtn2">전체 인쇄</button>
    </div>
    <p style="font-size:12px;color:#7c8493;margin:-6px 0 16px 0;">품목별 QR코드입니다. 인쇄해서 작업지시서·랙·박스 등에 부착하면,
    설비 입력화면에서 "QR로 품목 스캔" 버튼으로 폰 카메라를 켜서 이 QR을 찍는 것만으로 품목이 자동 입력됩니다 (품목 선택 드롭다운 대신 사용 가능, 인터넷 연결 없이도 카메라만 있으면 인식됩니다).</p>
    <div class="qr-grid" id="prodQrGrid"></div>
  `;
  document.getElementById('printBtn2').onclick = ()=>window.print();
  const grid = document.getElementById('prodQrGrid');
  grid.innerHTML = PRODUCTS.map((p,i)=>`
    <div class="qr-cell">
      <div class="qrimg" id="pqr-${i}"></div>
      <div class="eqid" style="font-size:12px;">${p.part_name}</div>
      <div class="eqname">[${p.model}]${p.part_no?' · '+p.part_no:''}</div>
    </div>
  `).join('');
  PRODUCTS.forEach((p,i)=>{
    const el = document.getElementById(`pqr-${i}`);
    QRCode.toDataURL(PROD_TAG + p.label, {width:110, margin:1, errorCorrectionLevel:'M'}, function(err, dataUrl){
      if(err){
        console.error('QR gen failed for product', i, p.label, err);
        if(el) el.innerHTML = '<div style="font-size:10px;color:var(--stale);padding:10px;">QR 생성 실패</div>';
        return;
      }
      if(el) el.innerHTML = `<img src="${dataUrl}" width="110" height="110" alt="QR">`;
    });
  });
}

// ---------- Camera QR scan (for product) ----------
let scanStream = null;
function stopScan(){
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  clearInterval(window.__scanTimer);
}
async function startProductScan(onResult){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;';
  overlay.innerHTML = `
    <video id="scanVideo" style="width:100%;max-width:420px;border-radius:10px;" playsinline muted></video>
    <div style="color:#fff;font-size:13px;margin-top:14px;">품목 QR을 카메라에 비춰주세요</div>
    <button id="scanCancel" style="margin-top:18px;padding:10px 20px;border-radius:8px;border:none;background:#444;color:#fff;font-size:13px;">취소</button>
  `;
  document.body.appendChild(overlay);
  const video = overlay.querySelector('#scanVideo');
  overlay.querySelector('#scanCancel').onclick = ()=>{ stopScan(); overlay.remove(); };
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){
    toast('카메라를 열 수 없습니다 (권한 또는 https 필요).');
    overlay.remove();
    return;
  }
  video.srcObject = scanStream;
  await video.play();
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  window.__scanTimer = setInterval(()=>{
    if(!video.videoWidth) return;
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = jsQR(imgData.data, imgData.width, imgData.height);
    if(code && code.data){
      stopScan();
      overlay.remove();
      onResult(code.data);
    }
  }, 300);
}

// ---------- Init ----------
if(FIREBASE_CONFIGURED){
  auth.onAuthStateChanged(user=>{
    currentUser = user;
    render();
  });
} else {
  render();
}
