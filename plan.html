<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOWOO 종합 생산관리</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--ink:#1d1d1f;--mut:#6b6b73;--line:#e6e6ea;--bg:#f4f4f6;--card:#fff;--hd:#1b1c22;--or:#e8892b;--red:#d93a3a;--redbg:#fdecec;--amb:#b26a00;--ambbg:#fff4e0;--grn:#1f8a4c;--grnbg:#e8f6ee;--blu:#2d5bd7;--blubg:#eaf0ff}
*{box-sizing:border-box}body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--hd);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header .brand small{display:block;color:var(--or);font-family:monospace;letter-spacing:2px;font-size:11px}header .brand b{font-size:20px}
nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}nav button{background:transparent;border:1px solid #444;color:#fff;border-radius:20px;padding:8px 16px;font-size:14px;cursor:pointer}
nav button.on{background:var(--or);border-color:var(--or);font-weight:700}
main{max-width:1280px;margin:18px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.up{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{background:var(--or);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--line);border-radius:16px;padding:5px 11px;font-size:12px;background:#fafafa}.chip.ok{background:var(--grnbg);border-color:#bfe3cd;color:var(--grn)}.chip.no{color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{border-radius:12px;padding:14px;border:1px solid var(--line);background:#fff;cursor:pointer}.kpi b{font-size:28px;display:block}.kpi span{color:var(--mut);font-size:12px}
.kpi.r{background:var(--redbg);border-color:#f3c2c2}.kpi.r b{color:var(--red)}.kpi.a{background:var(--ambbg);border-color:#f2d7a6}.kpi.a b{color:var(--amb)}.kpi.b{background:var(--blubg);border-color:#c9d6fb}.kpi.b b{color:var(--blu)}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
.muted{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f7f7f9;text-align:left;font-weight:600;color:#444;position:sticky;top:0}th,td{padding:7px 8px;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:top}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.t-AIR{background:var(--redbg);color:var(--red)}.t-CAP{background:var(--ambbg);color:var(--amb)}.t-RM{background:var(--blubg);color:var(--blu)}.t-OK{background:var(--grnbg);color:var(--grn)}
.alert{border-left:4px solid var(--red);background:var(--redbg);padding:10px 12px;border-radius:6px;margin:6px 0}.alert.a{border-color:var(--amb);background:var(--ambbg)}.alert.b{border-color:var(--blu);background:var(--blubg)}
.bar{display:flex;gap:2px;align-items:flex-end;height:34px}.bar i{display:block;width:12px;border-radius:2px 2px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px}label.f input{padding:7px;border:1px solid var(--line);border-radius:6px;font-size:14px;width:120px}
.sets{display:flex;gap:14px;flex-wrap:wrap}
.hide{display:none}
td.nm{white-space:normal;min-width:240px;max-width:320px}td.cz{white-space:normal;min-width:120px;max-width:160px}
</style>
</head>
<body>
<header>
  <div class="brand"><small>KOWOO KOREA · KOWOO THAI</small><b>종합 생산관리</b></div>
  <nav id="nav">
    <button data-t="alert" class="on">긴급 경보</button>
    <button data-t="short">결품·항공 위험</button>
    <button data-t="rm">원소재 발송 마감</button>
    <button data-t="spare">여유설비 제안</button>
    <button data-t="target">목표 대비 실적</button>
    <button data-t="files">자료 등록·설정</button>
  </nav>
</header>
<main>
  <div class="card">
    <div class="up">
      <button class="btn" onclick="document.getElementById('fi').click()">📁 엑셀 등록 (여러 파일 한 번에)</button>
      <input id="fi" type="file" multiple accept=".xlsx,.xlsm,.xls" class="hide">
      <span class="muted">파일 종류는 자동으로 알아봅니다: 생산실적(월별) · 일자별 발주서 · BALANCE STOCK · PO(원소재 송장) — 같은 종류를 다시 올리면 새 파일로 교체(생산실적은 월별로 누적)</span>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <section id="t-alert"></section>
  <section id="t-short" class="hide"></section>
  <section id="t-rm" class="hide"></section>
  <section id="t-spare" class="hide"></section>
  <section id="t-target" class="hide"></section>
  <section id="t-files" class="hide"></section>
</main>

<script>
/* KOWOO 종합 생산관리 분석 엔진 (브라우저/Node 공용)
 * 입력: SheetJS 워크북 (XLSX.read(..., {cellDates:true}))
 *  - 생산실적 (Productivity 월별, 설비별 시트)
 *  - 일자별 발주서 (한국→태국 주별 발송요청)
 *  - BALANCE STOCK (코우타이 재고: 동합재고 시트)
 *  - PO 파일 (invoice number-raw material: 원소재 해상 운송 ETD/ETA)
 * 출력: 결품·항공 경보, 원소재 발송 마감, 여유설비 제안, 일일 목표 대비 실적
 */
(function (root) {
  'use strict';
  const DAY = 86400000;
  const isNum = v => typeof v === 'number' && isFinite(v);
  const n = v => (isNum(v) ? v : 0);
  const s = v => (v == null ? '' : String(v)).replace(/\s+/g, ' ').trim();
  const toDate = v => {
    if (v instanceof Date) { const t = Math.round((v.getTime() - v.getTimezoneOffset() * 60000) / DAY) * DAY; const u = new Date(t); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate()); }
    if (isNum(v) && v > 30000 && v < 80000) return new Date(Math.round((v - 25569) * DAY) + new Date().getTimezoneOffset() * 60000);
    return null;
  };
  const addDays = (d, k) => new Date(d.getTime() + k * DAY);
  const ymd = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : '';
  const rows = (wb, name) => {
    const ws = wb.Sheets[name];
    if (!ws || !ws['!ref']) return [];
    const rg = root.XLSX.utils.decode_range(ws['!ref']); rg.s.c = 0; rg.s.r = 0;   // 항상 A1 기준 열번호
    return root.XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true, range: rg });
  };

  /* ---------- 기본 설정 ---------- */
  const DEFAULT_SETTINGS = {
    today: null,            // null이면 오늘
    seaLeadDays: 17,        // 한국 ETD → 코우타이 입고 (2026년 실측 중앙값 16~17일)
    koreaPrepDays: 0,       // 한국 공장 → ETD 까지 준비일
    prodLeadDays: 7,        // 원소재 입고 → 출하가능 (가공·검사·포장)
    wipLeadDays: 3,         // 재공품 → 출하가능
    shiftHours: 10.5,
    shiftsPerDay: 2,
    workDaysPerWeek: 6,
    idleDays: 7,            // 최근 N일 생산 0이면 여유설비
    targetQuantile: 0.75,   // 실적기준 목표 = 상위 25% 교대 속도
    underTargetRatio: 0.85, // 목표의 85% 미만이면 미달
    horizonWeeks: 10
  };

  /* 품목 → 공용소재 그룹 (코우타이 동합재고 'ใช้ RM ร่วมกัน' 묶음 + PO 원소재 품번 기준)
   * items: 일자별 발주서 품번, stockPns: 동합재고 품번(RM·WIP 합산), rmPns: 원소재 송장 품번,
   * cap: 생산실적에서 주간 생산능력을 읽을 항목 {item 정규식, process 정규식} */
  const DEFAULT_GROUPS = [
    { id: 'G01', name: 'NX4·KA4 MSCL/NON KEY (공용소재)', items: ['GL714N4000', 'GL714N4200', 'GL714R0000', 'GL714R0200'], stockPns: ['GL714N4000', 'GL714N4200', 'GL714R0000', 'GL714R0200'], rmPns: ['GL714N4000'], cap: { item: /^NX4 MSCL$/i, process: /CNC #20/i }, koreaCapaWeek: 24549, koreaCapaNote: 'NX4·KA4 CAPA표(250321) 선삭 6대 129.3초, 2교대×10.5h×7일' },
    { id: 'G02', name: "NX4·KA4 ESCL ASS'Y", items: ['GL714N4100', 'GL714R0100'], stockPns: ['GL714N4100', 'GL714R0100'], rmPns: ['GL714N4100'], cap: { item: /^NX4 ESCL$/i, process: /CNC#30-3/i } },
    { id: 'G03', name: 'GCI ESCL 공용소재 (HC/YB ETE·US4) ※MAIL 인도와 공용', items: ['GL714J2900', 'GL714A9700', 'GL714B1400', 'GL714J2700'], stockPns: ['GL714A8800', 'GM711A3100', 'GL714J2700', 'GL714J2900', 'GL714B1400', 'GL714A9700'], rmPns: ['GM711A3100'] },
    { id: 'G04', name: 'IB/GB 2900/3900 공용소재 (TL/QL N/K·HC/YB MTE) ※MAIL 인도와 공용', items: ['GL714A8701', 'GL714J2800', 'GL714J2810'], stockPns: ['GM711A2900', 'GM711A3900', 'GL714A8701', 'GL714J2800'], rmPns: ['GM711A2900'] },
    { id: 'G05', name: 'HC/YB MSCL TILT', items: ['GL714J2600'], stockPns: ['GL714J2600', 'GL714K3010'], rmPns: ['GL714J2600'] },
    { id: 'G06', name: 'AX S/U', items: ['GL714O6000'], stockPns: ['GL714O6000', 'GL714O6009'], rmPns: ['GL714O6000'] },
    { id: 'G07', name: 'Y450 MSCL', items: ['GL714B1200'], stockPns: ['GL714B1200'], rmPns: ['GL714B1200'] },
    { id: 'G08', name: 'Y450 ESCL', items: ['GL714B1300'], stockPns: ['GL714B1300'], rmPns: ['GL714B1300'] },
    { id: 'G09', name: 'RB C-MDPS', items: ['GM71133300'], stockPns: ['GM71133300'], rmPns: ['GM71133300'], cap: { item: /^RB C-MPDS$/i, process: /Key Hole/i } },
    { id: 'G10', name: 'X103 MSCL', items: ['GL714J5200'], stockPns: ['GL714J5200'], rmPns: ['GL714J5200'] },
    { id: 'G11', name: 'X103 ESCL', items: ['GL714J5300'], stockPns: ['GL714J5300'], rmPns: ['GL714J5300'] },
    { id: 'G12', name: 'C300 MSCL', items: ['GL714A3800'], stockPns: ['GL714A3800'], rmPns: ['GL714A3800'] },
    { id: 'G13', name: 'C300 ESCL', items: ['GL714A4800'], stockPns: ['GL714A4800'], rmPns: ['GL714A4800'] },
    { id: 'G14', name: 'X81C LHD', items: ['GA711A1300'], stockPns: ['GA711A1300'], rmPns: ['GA711A1300'] },
    { id: 'G15', name: 'X81C RHD', items: ['GA711A1100'], stockPns: ['GA711A1100'], rmPns: ['GA711A1100'] },
    { id: 'G16', name: 'PU 1.4 10P/J', items: ['GU825B1700'], stockPns: ['GU825B1700'], rmPns: ['GU825B1700'] },
    { id: 'G17', name: 'PU 4WD 내수 10P/J', items: ['GU83130300'], stockPns: ['GU83130300'], rmPns: ['GU83130300'] },
    { id: 'G18', name: 'PU 2WD 내수 10P/J', items: ['GU83131600'], stockPns: ['GU83131600'], rmPns: ['GU83131600'] },
    { id: 'G19', name: 'PU 2WD 수출 10P/J', items: ['GU83132500'], stockPns: ['GU83132500'], rmPns: ['GU83132500'] },
    { id: 'G20', name: 'PU 4WD 수출 10P/J', items: ['GU83132600'], stockPns: ['GU83132600'], rmPns: ['GU83132600'] },
    { id: 'G21', name: 'PU 2WD (RH KJ2.9) 10P/J', items: ['GU82534200'], stockPns: ['GU82534200'], rmPns: ['GU82534200'] }
  ];

  /* ---------- 파일 종류 판별 ---------- */
  function detectFileType(wb) {
    const names = wb.SheetNames;
    if (names.includes('일자별 발주서')) return 'shipPlan';
    if (names.includes('동합재고')) return 'stock';
    if (names.includes('invoice number-raw material') && names.includes('buy-back Korea')) return 'poInvoice';
    if (names.some(n => /생산 종합 현황/.test(n)) || names.some(n => /^(KWI|DH)-CL-/.test(n))) return 'productivity';
    const r = rows(wb, names[0]);
    if (r.slice(0, 4).some(x => x && x.some(v => /C A P A/.test(s(v))))) return 'capa';
    return 'unknown';
  }

  /* ---------- 생산실적 ---------- */
  const PROD_SKIP = /^(F[123]\.|생산 종합 현황|생산현황|[123]\.(Press|CNC|HYD)|Item Data)/;
  function parseProductivity(wb) {
    let month = null;
    const sum = rows(wb, wb.SheetNames.find(n => n === '생산 종합 현황') || '');
    if (sum[1]) month = toDate(sum[1][3]);
    let bldg = 'F1';
    const recs = [];
    for (const name of wb.SheetNames) {
      if (/^F[123]\.$/.test(name)) bldg = name.slice(0, 2);
      if (PROD_SKIP.test(name)) continue;
      const R = rows(wb, name);
      for (let i = 1; i < R.length; i++) {
        const it = R[i];
        if (!it || it.length < 40) continue;
        if (!/qty/i.test(s(it[6])) || !/net/i.test(s(it[3]))) continue;
        const op = R[i - 1] || [];
        const find = (col, re) => { for (let k = i; k < Math.min(i + 9, R.length); k++) { if (R[k] && re.test(s(R[k][col]))) return R[k]; } return null; };
        const cap = find(6, /^capa/i), hrs = find(5, /^working hours/i), ng = find(6, /^ng p/i);
        const eff = R[i + 2] && isNum(R[i + 2][4]) ? R[i + 2][4] : null; // Work Efficiency 행
        for (let d = 0; d < 31; d++) {
          const c = 8 + d, q = it[c], h = hrs ? hrs[c] : null;
          if ((isNum(q) && q > 0) || (isNum(h) && h > 0)) {
            recs.push({
              month: month ? ymd(month).slice(0, 7) : '', bldg, machine: name,
              item: s(it[0]), shift: s(it[1]), process: s(it[2]), netct: isNum(it[4]) ? it[4] : null, eff,
              day: d + 1, date: month ? addDays(month, d) : null, operator: s(op[c]),
              qty: n(q), hours: n(h), capa: cap ? n(cap[c]) : 0, ng: ng ? n(ng[c]) : 0
            });
          }
        }
      }
    }
    // 이상치 표시
    for (const r of recs) r.bad = r.hours > 12 || /^\d+$/.test(r.operator);
    return { month: month ? ymd(month) : null, machines: [...new Set(recs.map(r => r.machine))], allSheets: wb.SheetNames.filter(n => !PROD_SKIP.test(n)), records: recs };
  }

  /* ---------- 일자별 발주서 ---------- */
  function parseShipPlan(wb) {
    const R = rows(wb, '일자별 발주서');
    const hdr = R[1] || [];
    const cols = [];
    for (let j = 16; j < hdr.length; j++) { const d = toDate(hdr[j]); if (d && j >= 24) cols.push([j, d]); }
    const items = [];
    for (let i = 2; i < R.length - 1; i++) {
      const a = R[i];
      if (!a || s(a[14]) !== '발주수량') continue;
      const b = R[i + 1] || [];
      const pn = s(a[4]) || s(a[1]);
      if (!pn) continue;
      items.push({
        pn, thPn: s(a[5]), name: s(a[6]) || s(a[3]), rmPn: s(a[7]), cls: s(a[15]), mean6: n(a[22]),
        weeks: cols.map(([j, d]) => ({ date: d, req: n(a[j]), ship: n(b[j]) }))
      });
    }
    return { weeks: cols.map(c => c[1]), items };
  }

  /* ---------- 코우타이 재고 (동합재고) ---------- */
  function parseStock(wb) {
    const R = rows(wb, '동합재고');
    const title = s((R[0] || [])[0]);
    const out = [];
    for (let i = 3; i < R.length; i++) {
      const r = R[i];
      if (!r || !s(r[1])) continue;
      out.push({ name: s(r[1]), pn: s(r[2]), onboard: n(r[5]), rm: n(r[6]) + n(r[7]), wipPD: n(r[8]), wipPK: n(r[9]), hold: n(r[10]), wipWH: n(r[11]), wip: n(r[12]), fg: n(r[13]) + n(r[14]), shared: /ร่วม/.test(s(r[3])) });
    }
    return { title, rows: out };
  }

  /* ---------- PO 파일: 원소재 해상운송 ---------- */
  function parsePOInvoice(wb) {
    const R = rows(wb, 'invoice number-raw material');
    const list = [];
    for (let i = 7; i < R.length; i++) {
      const r = R[i];
      if (!r || !s(r[1])) continue;
      const etd = toDate(r[8]), eta = toDate(r[14]);
      if (!etd) continue;
      list.push({ inv: s(r[1]), pn: s(r[2]), item: s(r[3]), qty: n(r[4]), etd, etaPort: toDate(r[11]), eta, status: s(r[15]).toLowerCase() });
    }
    const lt = list.filter(x => x.eta && x.etd.getFullYear() >= new Date().getFullYear() - 1).map(x => (x.eta - x.etd) / DAY).filter(x => x > 0 && x < 40).sort((a, b) => a - b);
    const med = lt.length ? lt[Math.floor(lt.length / 2)] : null;
    return { list, onboard: list.filter(x => x.status === 'on board'), leadMedian: med, leadSamples: lt.length };
  }

  /* ---------- 분석 ---------- */
  function analyze(data, settingsIn, groupsIn) {
    const S = Object.assign({}, DEFAULT_SETTINGS, settingsIn || {});
    const groups = groupsIn || DEFAULT_GROUPS;
    const today = S.today ? toDate(S.today instanceof Date ? S.today : new Date(S.today)) : toDate(new Date());
    const out = { today, settings: S, shortage: [], rmPlan: [], spare: [], targets: [], underTarget: [], notes: [] };
    const prod = data.productivity ? [].concat(...data.productivity.map(p => p.records)).filter(r => !r.bad) : [];
    const lastProdDate = prod.reduce((m, r) => (r.date && (!m || r.date > m) ? r.date : m), null);

    /* --- 1. 일일 목표 & 전일 실적 점검 (설비·품목·공정) --- */
    const grp = {};
    for (const r of prod) {
      if (!(r.hours >= 2 && r.qty > 0)) continue;
      const k = r.machine + '|' + r.item + '|' + r.process;
      (grp[k] = grp[k] || []).push(r);
    }
    const quant = (a, q) => { const b = [...a].sort((x, y) => x - y); const p = (b.length - 1) * q, lo = Math.floor(p); return b[lo] + (b[Math.min(lo + 1, b.length - 1)] - b[lo]) * (p - lo); };
    for (const [k, list] of Object.entries(grp)) {
      if (list.length < 4) continue;
      const rates = list.map(r => r.qty / r.hours);
      const tgtRate = quant(rates, S.targetQuantile);
      const med = quant(rates, 0.5);
      const [machine, item, process] = k.split('|');
      const r0 = list[0];
      const thaiStd = r0.netct && r0.eff ? 3600 / (r0.netct / r0.eff) : null;
      const t = { machine, bldg: r0.bldg, item, process, n: list.length, medRate: med, targetRate: tgtRate, targetShift: Math.round(tgtRate * S.shiftHours / 10) * 10, thaiShiftCapa: thaiStd ? Math.round(thaiStd * S.shiftHours) : null };
      out.targets.push(t);
      if (lastProdDate) {
        for (const r of list.filter(x => +x.date === +lastProdDate)) {
          const tgt = tgtRate * r.hours;
          if (r.qty < tgt * S.underTargetRatio) out.underTarget.push({ date: lastProdDate, machine, bldg: r.bldg, item, process, shift: r.shift, operator: r.operator, qty: r.qty, hours: r.hours, target: Math.round(tgt), ratio: r.qty / tgt, lostHours: Math.max(0, S.shiftHours - r.hours) });
        }
      }
    }
    out.targets.sort((a, b) => a.bldg.localeCompare(b.bldg) || a.machine.localeCompare(b.machine));
    out.underTarget.sort((a, b) => a.ratio - b.ratio);
    out.lastProdDate = lastProdDate;

    /* --- 2. 설비 가동 현황 → 여유설비 --- */
    const machineAll = new Set([].concat(...(data.productivity || []).map(p => p.allSheets)));
    const lastRun = {}, procOfMachine = {};
    for (const r of prod) {
      if (r.qty > 0 && (!lastRun[r.machine] || r.date > lastRun[r.machine])) lastRun[r.machine] = r.date;
      (procOfMachine[r.machine] = procOfMachine[r.machine] || new Set()).add(r.process);
    }
    const kindOf = m => /CL-/i.test(m) ? 'CNC 선반' : /CNM|MCT/i.test(m) ? 'MCT' : /DHP|HYD/i.test(m) ? '유압프레스' : /^HP-/i.test(m) ? '프레스' : /Straighten/i.test(m) ? '교정기' : /Marking/i.test(m) ? '마킹기' : /WELD/i.test(m) ? '용접기' : '기타';
    const idle = [];
    if (lastProdDate) {
      for (const m of machineAll) {
        const lr = lastRun[m];
        const idleDays = lr ? Math.round((lastProdDate - lr) / DAY) : null;
        if (!lr || idleDays >= S.idleDays) idle.push({ machine: m, kind: kindOf(m), lastRun: lr, idleDays: lr ? idleDays : '실적없음', processes: procOfMachine[m] ? [...procOfMachine[m]].join(', ') : '' });
      }
    }
    out.idleMachines = idle.sort((a, b) => a.kind.localeCompare(b.kind) || String(a.machine).localeCompare(b.machine));

    /* --- 3. 결품·항공 경보 + 원소재 발송 마감 --- */
    const plan = data.shipPlan;
    const stock = data.stock ? data.stock.rows : [];
    const onboard = data.poInvoice ? data.poInvoice.onboard : [];
    if (!plan) out.notes.push('일자별 발주서가 없어 결품 경보를 계산하지 않았습니다.');
    if (plan) {
      const stockBy = pn => stock.filter(r => r.pn === pn);
      const futureWeeks = plan.weeks.filter(d => d >= today).slice(0, S.horizonWeeks);
      for (const g of groups) {
        const items = plan.items.filter(i => g.items.includes(i.pn));
        if (!items.length) continue;
        let backlog = 0; const dem = futureWeeks.map(() => 0);
        for (const it of items) for (const w of it.weeks) {
          if (w.date < today) backlog += w.req - w.ship;
          else { const k = futureWeeks.findIndex(d => +d === +w.date); if (k >= 0) dem[k] += w.req; }
        }
        if (backlog <= 0 && dem.every(x => !x)) continue;
        const fg = g.items.reduce((a, pn) => a + stockBy(pn).reduce((b, r) => b + r.fg, 0), 0);
        const wip = g.stockPns.reduce((a, pn) => a + stockBy(pn).reduce((b, r) => b + r.wip, 0), 0);
        const rm = g.stockPns.reduce((a, pn) => a + stockBy(pn).reduce((b, r) => b + r.rm, 0), 0);
        const ob = onboard.filter(o => g.rmPns.includes(o.pn));
        // 주간 생산능력 (생산실적 실측)
        let capWeek = null, capNote = '';
        if (g.cap && prod.length) {
          const rr = prod.filter(r => g.cap.item.test(r.item) && g.cap.process.test(r.process));
          if (rr.length) {
            const days = new Set(prod.map(r => ymd(r.date))).size;
            const span = Math.max(1, Math.round((lastProdDate - prod.reduce((m, r) => (!m || r.date < m ? r.date : m), null)) / DAY) + 1);
            capWeek = rr.reduce((a, r) => a + r.qty, 0) / span * 7;
            capNote = `생산실적 ${span}일 실측 (${g.cap.process.source})`;
          }
        }
        let cum = Math.max(0, backlog), first = null, firstMat = null;
        const weekly = futureWeeks.map((d, k) => {
          cum += dem[k];
          const arrived = ob.filter(o => o.eta && addDays(o.eta, S.prodLeadDays) <= d).reduce((a, o) => a + o.qty, 0);
          const mat = (d >= addDays(today, S.prodLeadDays) ? rm : 0) + arrived;
          const wipOk = d >= addDays(today, S.wipLeadDays) ? wip : 0;
          const capCum = capWeek != null ? capWeek / 7 * Math.max(0, (d - today) / DAY) : Infinity;
          const supply = fg + wipOk + Math.min(mat, capCum);
          const supplyMat = fg + wipOk + mat;
          if (!first && supply < cum) first = { date: d, qty: cum - supply, k };
          if (!firstMat && supplyMat < cum) firstMat = { date: d, qty: cum - supplyMat };
          return { date: d, demand: dem[k], cumDemand: cum, supply, balance: supply - cum };
        });
        // 원인·등급
        const seaFix = addDays(today, S.koreaPrepDays + S.seaLeadDays + S.prodLeadDays);
        let level = 'OK', cause = '', action = '';
        if (first) {
          const onHandAll = fg + wip + rm + ob.reduce((a, o) => a + o.qty, 0);
          cause = !(firstMat && +firstMat.date <= +first.date) ? '생산능력 부족'
            : (onHandAll >= weekly[first.k].cumDemand ? '생산 지연 (소재는 있음)' : '소재 부족');
          if (first.date < seaFix) {
            level = 'AIR';
            action = cause === '소재 부족'
              ? `${ymd(first.date)} 발송분 ${Math.round(first.qty).toLocaleString()}개 부족 — 지금 원소재를 배로 보내도 늦음. 항공 또는 한국 대응 검토`
              : `${ymd(first.date)} 발송분 ${Math.round(first.qty).toLocaleString()}개 부족 — 현재 생산속도로는 못 맞춤. 즉시 증산(여유설비·잔업) 또는 항공 검토`;
          } else {
            level = cause === '소재 부족' ? 'RM' : 'CAP';
            action = cause === '소재 부족' ? '원소재 발송 마감표 참고하여 해상 발송' : '증산 필요 (여유설비 제안 참고)';
          }
        }
        if (capWeek != null && dem.reduce((a, b) => a + b, 0) / Math.max(1, futureWeeks.length) > capWeek && !/생산능력/.test(cause)) cause = (cause ? cause + ' + ' : '') + '생산능력 부족';
        if (level === 'OK' && /생산능력/.test(cause)) { level = 'CAP'; action = '증산 필요 (여유설비 제안 참고)'; }
        const rec = { id: g.id, name: g.name, items: items.map(i => `${i.pn} ${i.name}`).join(' / '), backlog, demand: dem.reduce((a, b) => a + b, 0), fg, wip, rm, onboardQty: ob.reduce((a, o) => a + o.qty, 0), onboardEta: ob.length ? ymd(ob.reduce((m, o) => (!m || o.eta > m ? o.eta : m), null)) : '', capWeek, capNote, koreaCapaWeek: g.koreaCapaWeek || null, avgWeeklyDemand: dem.reduce((a, b) => a + b, 0) / Math.max(1, futureWeeks.length), level, cause, action, first, weekly };
        out.shortage.push(rec);

        // 원소재 발송 마감: 해당 주 출하에 필요한 추가 소재(재고·운송중으로 못 채우는 양)
        const haveTotal = fg + wip + rm + rec.onboardQty;
        let prevNeed = 0;
        weekly.forEach(w => {
          const need = Math.max(0, w.cumDemand - haveTotal);
          if (need > prevNeed) {
            const latestEtd = addDays(w.date, -(S.prodLeadDays + S.seaLeadDays + S.koreaPrepDays));
            out.rmPlan.push({ id: g.id, name: g.name, shipWeek: w.date, addQty: need - prevNeed, cumQty: need, latestEtd, overdue: latestEtd < today, daysLeft: Math.round((latestEtd - today) / DAY) });
            prevNeed = need;
          }
        });

        // 여유설비 제안 (생산능력 부족)
        if (capWeek != null && rec.avgWeeklyDemand > capWeek) {
          const gap = rec.avgWeeklyDemand - capWeek;
          const rr = prod.filter(r => g.cap.item.test(r.item) && g.cap.process.test(r.process) && r.hours >= 2);
          const perMachineWeek = rr.length ? (rr.reduce((a, r) => a + r.qty, 0) / rr.reduce((a, r) => a + r.hours, 0)) * S.shiftHours * S.shiftsPerDay * S.workDaysPerWeek : null;
          const kind = rr.length ? kindOf(rr[0].machine) : 'CNC 선반';
          const used = [...new Set(rr.map(r => r.machine))];
          const cands = idle.filter(m => m.kind === kind);
          const needN = perMachineWeek ? Math.ceil(gap / perMachineWeek) : null;
          out.spare.push({ id: g.id, name: g.name, process: g.cap.process.source, demandWeek: rec.avgWeeklyDemand, capWeek, gapWeek: gap, perMachineWeek, machinesNow: used.join(', '), machinesNeeded: needN, kind, candidates: cands.slice(0, Math.max(needN || 3, 3) + 3).map(c => `${c.machine} (${c.idleDays === '실적없음' ? '실적없음' : c.idleDays + '일째 비가동'})`) });
        }
      }
      const order = { AIR: 0, CAP: 1, RM: 2, OK: 3 };
      out.shortage.sort((a, b) => order[a.level] - order[b.level] || (a.first ? +a.first.date : 9e15) - (b.first ? +b.first.date : 9e15));
      out.rmPlan.sort((a, b) => a.latestEtd - b.latestEtd);
    }
    return out;
  }

  const api = { DEFAULT_SETTINGS, DEFAULT_GROUPS, detectFileType, parseProductivity, parseShipPlan, parseStock, parsePOInvoice, analyze, ymd };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.KowooPlan = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
const P = window.KowooPlan;
const DATA = { productivity: {}, shipPlan: null, stock: null, poInvoice: null, meta: {} };
let SET = Object.assign({}, P.DEFAULT_SETTINGS, { today: P.ymd(new Date()) });
let R = null;
const fmt = v => v == null || v === '' ? '' : (typeof v === 'number' ? Math.round(v).toLocaleString() : v);
const d8 = d => d ? P.ymd(d instanceof Date ? d : new Date(d)).slice(5).replace('-', '/') : '';
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const LV = { AIR: '항공 검토', CAP: '증산 필요', RM: '원소재 발송', OK: '정상' };

document.getElementById('nav').onclick = e => {
  const t = e.target.dataset.t; if (!t) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('hide', s.id !== 't-' + t));
};
const go = t => document.querySelector(`nav button[data-t="${t}"]`).click();

document.getElementById('fi').onchange = async e => {
  for (const f of e.target.files) {
    const wb = XLSX.read(await f.arrayBuffer(), { cellDates: true });
    const type = P.detectFileType(wb);
    const meta = { name: f.name, at: new Date().toLocaleString() };
    if (type === 'productivity') { const p = P.parseProductivity(wb); DATA.productivity[(p.month || f.name).slice(0, 7)] = p; DATA.meta['생산실적 ' + (p.month || '').slice(0, 7)] = meta; }
    else if (type === 'shipPlan') { DATA.shipPlan = P.parseShipPlan(wb); DATA.meta['일자별 발주서'] = meta; }
    else if (type === 'stock') { DATA.stock = P.parseStock(wb); DATA.meta['코우타이 재고'] = meta; }
    else if (type === 'poInvoice') { DATA.poInvoice = P.parsePOInvoice(wb); DATA.meta['PO·원소재 운송'] = meta; if (DATA.poInvoice.leadMedian) SET.seaLeadDays = DATA.poInvoice.leadMedian; }
    else alert(f.name + ' — 어떤 자료인지 알아보지 못했습니다.');
  }
  e.target.value = ''; run();
};

function run() {
  const d = { productivity: Object.values(DATA.productivity), shipPlan: DATA.shipPlan, stock: DATA.stock, poInvoice: DATA.poInvoice };
  R = P.analyze(d, SET);
  renderChips(); renderAlert(); renderShort(); renderRM(); renderSpare(); renderTarget(); renderFiles();
}
function renderChips() {
  const need = ['생산실적', '일자별 발주서', '코우타이 재고', 'PO·원소재 운송'];
  const have = Object.keys(DATA.meta);
  document.getElementById('chips').innerHTML = need.map(k => { const h = have.filter(x => x.startsWith(k)); return h.length ? h.map(x => `<span class="chip ok">✔ ${esc(x)} · ${esc(DATA.meta[x].name)}</span>`).join('') : `<span class="chip no">○ ${k} 미등록</span>`; }).join('');
}

function renderAlert() {
  const air = R.shortage.filter(x => x.level === 'AIR'), cap = R.shortage.filter(x => x.level === 'CAP'), rm = R.rmPlan.filter(x => x.daysLeft <= 7);
  const under = R.underTarget;
  let h = `<div class="kpis">
    <div class="kpi r" onclick="go('short')"><b>${air.length}</b><span>항공 검토 품목 (해상으로 못 맞춤)</span></div>
    <div class="kpi a" onclick="go('short')"><b>${cap.length + R.spare.length}</b><span>생산능력 부족 / 증산 필요</span></div>
    <div class="kpi b" onclick="go('rm')"><b>${rm.length}</b><span>7일 내 원소재 발송 마감 (지난 것 포함)</span></div>
    <div class="kpi" onclick="go('spare')"><b>${(R.idleMachines || []).length}</b><span>여유설비 (${SET.idleDays}일+ 비가동)</span></div>
    <div class="kpi" onclick="go('target')"><b>${under.length}</b><span>전일(${d8(R.lastProdDate)}) 목표 미달 교대</span></div>
  </div>`;
  h = `<div class="card"><h2>오늘 기준 (${SET.today}) 놓치면 안 되는 것</h2>${h}</div><div class="card"><h2>🚨 조치 필요 순서</h2>`;
  const items = [];
  air.forEach(x => items.push(`<div class="alert"><b>[항공 검토] ${esc(x.name)}</b> — ${esc(x.action)}<div class="muted">원인: ${x.cause} · 밀린 수량 ${fmt(x.backlog)} · 완제품 ${fmt(x.fg)} · 재공 ${fmt(x.wip)} · 원소재 ${fmt(x.rm)} · 운송중 ${fmt(x.onboardQty)}</div></div>`));
  R.spare.forEach(x => items.push(`<div class="alert a"><b>[증산] ${esc(x.name)}</b> — 주 ${fmt(x.demandWeek)}개 필요한데 현재 속도 주 ${fmt(x.capWeek)}개. ${x.machinesNeeded ? `같은 공정(${esc(x.process)}) 설비 약 <b>${x.machinesNeeded}대</b> 추가 필요` : ''} → 후보: ${esc(x.candidates.slice(0, 4).join(', '))}</div>`));
  rm.slice(0, 15).forEach(x => items.push(`<div class="alert b"><b>[원소재] ${esc(x.name)}</b> — ${x.overdue ? `<b>발송 마감 ${-x.daysLeft}일 지남</b>` : `${x.daysLeft}일 안에`} ${d8(x.latestEtd)} ETD까지 <b>${fmt(x.addQty)}개분</b> 발송 (태국 ${d8(x.shipWeek)} 출하분)</div>`));
  h += items.length ? items.join('') : '<div class="muted">자료를 등록하면 경보가 표시됩니다.</div>';
  document.getElementById('t-alert').innerHTML = h + '</div>' + (R.notes.length ? `<div class="card muted">${R.notes.map(esc).join('<br>')}</div>` : '');
}

function renderShort() {
  if (!R.shortage.length) { document.getElementById('t-short').innerHTML = '<div class="card muted">일자별 발주서 + 코우타이 재고를 등록하세요.</div>'; return; }
  const wk = R.shortage[0].weekly.map(w => w.date);
  let h = `<div class="card"><h2>품목(공용소재 그룹)별 결품 예측 — 태국 출하 기준 주별 과부족</h2>
  <div class="muted">공급 = 완제품 + 재공(${SET.wipLeadDays}일 후) + 원소재·운송중 소재(입고 ${SET.prodLeadDays}일 후, 생산속도 한도 내). 빨간 칸 = 그 주 요청을 못 맞춤. 해상 리드타임 ${SET.seaLeadDays}일+가공 ${SET.prodLeadDays}일 안에 생기는 결품은 원소재를 지금 보내도 늦으므로 '항공 검토'.</div>
  <div class="tw"><table><tr><th>판정</th><th>품목 그룹</th><th>원인</th><th class="n">밀린수량</th><th class="n">완제품</th><th class="n">재공</th><th class="n">원소재</th><th class="n">운송중</th><th class="n">주간능력(실측)</th>${wk.map(d => `<th class="n">${d8(d)}</th>`).join('')}</tr>`;
  for (const x of R.shortage) {
    h += `<tr><td><span class="tag t-${x.level}">${LV[x.level]}</span></td><td class="nm"><b>${esc(x.name)}</b><div class="muted">${esc(x.items)}</div></td><td class="cz">${esc(x.cause)}</td><td class="n">${fmt(x.backlog)}</td><td class="n">${fmt(x.fg)}</td><td class="n">${fmt(x.wip)}</td><td class="n">${fmt(x.rm)}</td><td class="n">${fmt(x.onboardQty)}${x.onboardEta ? `<div class="muted">~${d8(x.onboardEta)}</div>` : ''}</td><td class="n">${x.capWeek ? fmt(x.capWeek) : '<span class="muted">-</span>'}${x.koreaCapaWeek ? `<div class="muted">한국CAPA ${fmt(x.koreaCapaWeek)}</div>` : ''}</td>`;
    h += x.weekly.map(w => `<td class="n" style="background:${w.balance < 0 ? '#fde1e1' : ''}" title="수요 ${fmt(w.demand)} / 누적수요 ${fmt(w.cumDemand)} / 공급가능 ${fmt(w.supply)}">${w.demand ? `<div class="muted">${fmt(w.demand)}</div>` : ''}${fmt(w.balance)}</td>`).join('') + '</tr>';
  }
  document.getElementById('t-short').innerHTML = h + '</table></div></div>';
}

function renderRM() {
  let h = `<div class="card"><h2>원소재 해상 발송 마감 (늦어도 이 날짜에 한국 ETD)</h2><div class="muted">마감 ETD = 태국 출하주 − 가공 ${SET.prodLeadDays}일 − 해상 ${SET.seaLeadDays}일(실측 중앙값) − 한국 준비 ${SET.koreaPrepDays}일. 수량은 코우타이 재고·재공·원소재·운송중으로 못 채우는 추가분.</div>
  <div class="tw"><table><tr><th>상태</th><th>품목 그룹</th><th>마감 ETD</th><th class="n">남은 일수</th><th class="n">추가 발송량</th><th class="n">누적 필요량</th><th>쓰일 태국 출하주</th></tr>`;
  for (const x of R.rmPlan) h += `<tr><td><span class="tag ${x.overdue ? 't-AIR' : x.daysLeft <= 7 ? 't-CAP' : 't-RM'}">${x.overdue ? '마감 지남' : x.daysLeft <= 7 ? '이번주' : '예정'}</span></td><td>${esc(x.name)}</td><td><b>${P.ymd(x.latestEtd)}</b></td><td class="n">${x.daysLeft}</td><td class="n"><b>${fmt(x.addQty)}</b></td><td class="n">${fmt(x.cumQty)}</td><td>${P.ymd(x.shipWeek)}</td></tr>`;
  h += '</table></div>';
  if (DATA.poInvoice) {
    h += `<h3>현재 바다 위 원소재 (PO 파일, status = on board)</h3><div class="tw" style="max-height:300px"><table><tr><th>송장</th><th>품번</th><th>품목</th><th class="n">수량</th><th>ETD</th><th>코우타이 도착 예정</th></tr>` +
      DATA.poInvoice.onboard.map(o => `<tr><td>${esc(o.inv)}</td><td>${esc(o.pn)}</td><td>${esc(o.item)}</td><td class="n">${fmt(o.qty)}</td><td>${d8(o.etd)}</td><td>${d8(o.eta)}</td></tr>`).join('') + '</table></div>';
  }
  document.getElementById('t-rm').innerHTML = h + '</div>';
}

function renderSpare() {
  let h = `<div class="card"><h2>생산능력 부족 품목 ↔ 여유설비 짝짓기</h2>`;
  h += R.spare.length ? R.spare.map(x => `<div class="alert a"><b>${esc(x.name)}</b> · 병목 공정 ${esc(x.process)} (${esc(x.kind)})<br>필요 주 ${fmt(x.demandWeek)}개 − 현재 주 ${fmt(x.capWeek)}개 = 부족 <b>주 ${fmt(x.gapWeek)}개</b> · 설비 1대 주 ${fmt(x.perMachineWeek)}개(실측 속도, 2교대 ${SET.workDaysPerWeek}일) → <b>${x.machinesNeeded}대</b> 추가<br>현재 생산 설비: ${esc(x.machinesNow)}<br>투입 후보(같은 종류, 비가동): <b>${esc(x.candidates.join(', '))}</b><div class="muted">치공구·프로그램 이관 가능 여부는 현장 확인 필요</div></div>`).join('') : '<div class="muted">현재 생산능력이 부족한 품목이 없거나, 생산실적이 없습니다.</div>';
  h += `<h3>여유설비 목록 (최근 실적일 ${d8(R.lastProdDate)} 기준 ${SET.idleDays}일 이상 생산 없음)</h3><div class="tw" style="max-height:420px"><table><tr><th>설비</th><th>종류</th><th>마지막 생산일</th><th class="n">비가동 일수</th><th>최근 하던 공정</th></tr>` +
    (R.idleMachines || []).map(m => `<tr><td>${esc(m.machine)}</td><td>${m.kind}</td><td>${d8(m.lastRun)}</td><td class="n">${m.idleDays}</td><td class="muted nm">${esc(m.processes)}</td></tr>`).join('') + '</table></div></div>';
  document.getElementById('t-spare').innerHTML = h;
}

function renderTarget() {
  let h = `<div class="card"><h2>전일(${d8(R.lastProdDate)}) 목표 미달 — 목표의 ${Math.round(SET.underTargetRatio * 100)}% 미만</h2><div class="muted">목표 = 같은 설비·품목·공정에서 상위 ${Math.round((1 - SET.targetQuantile) * 100)}% 교대가 낸 시간당 속도 × 그 교대 작업시간. 작업시간이 ${SET.shiftHours}h보다 짧으면 시간 손실도 함께 확인하세요.</div>
  <div class="tw" style="max-height:380px"><table><tr><th>동</th><th>설비</th><th>품목</th><th>공정</th><th>교대</th><th>작업자</th><th class="n">실적</th><th class="n">목표</th><th class="n">달성률</th><th class="n">작업시간</th></tr>` +
    R.underTarget.map(u => `<tr><td>${u.bldg}</td><td>${esc(u.machine)}</td><td>${esc(u.item)}</td><td>${esc(u.process)}</td><td>${u.shift}</td><td>${esc(u.operator)}</td><td class="n">${fmt(u.qty)}</td><td class="n">${fmt(u.target)}</td><td class="n" style="color:var(--red)">${Math.round(u.ratio * 100)}%</td><td class="n">${u.hours.toFixed(1)}h</td></tr>`).join('') + '</table></div></div>';
  h += `<div class="card"><h2>설비·품목·공정별 1교대 목표수량 (현장 배포용)</h2><div class="tw"><table><tr><th>동</th><th>설비</th><th>품목</th><th>공정</th><th class="n">기록 교대수</th><th class="n">평균 개/h</th><th class="n">목표 개/h</th><th class="n">목표 / 1교대 (${SET.shiftHours}h)</th><th class="n">코우타이 파일 CAPA/교대</th></tr>` +
    R.targets.map(t => `<tr><td>${t.bldg}</td><td>${esc(t.machine)}</td><td>${esc(t.item)}</td><td>${esc(t.process)}</td><td class="n">${t.n}</td><td class="n">${t.medRate.toFixed(1)}</td><td class="n">${t.targetRate.toFixed(1)}</td><td class="n"><b>${fmt(t.targetShift)}</b></td><td class="n muted">${fmt(t.thaiShiftCapa)}</td></tr>`).join('') + '</table></div></div>';
  document.getElementById('t-target').innerHTML = h;
}

function renderFiles() {
  const f = (k, lbl, step) => `<label class="f">${lbl}<input type="number" step="${step || 1}" value="${SET[k]}" onchange="SET['${k}']=+this.value;run()"></label>`;
  let h = `<div class="card"><h2>계산 기준 (바꾸면 모든 경보가 즉시 다시 계산됩니다)</h2><div class="sets">
    <label class="f">기준일<input type="date" value="${SET.today}" onchange="SET.today=this.value;run()"></label>
    ${f('seaLeadDays', '해상 리드타임 ETD→입고 (일)')}${f('koreaPrepDays', '한국 준비일 (공장→ETD)')}${f('prodLeadDays', '원소재→출하가능 (일)')}${f('wipLeadDays', '재공→출하가능 (일)')}
    ${f('shiftHours', '1교대 시간', 0.5)}${f('workDaysPerWeek', '주 가동일')}${f('idleDays', '여유설비 판정 (일)')}${f('underTargetRatio', '미달 기준 (0~1)', 0.05)}
  </div><div class="muted" style="margin-top:8px">해상 리드타임은 PO 파일 원소재 송장 ${DATA.poInvoice ? DATA.poInvoice.leadSamples + '건의 실측 중앙값' : '(미등록 시 기본 17일)'}으로 자동 설정됩니다.</div></div>`;
  h += `<div class="card"><h2>등록된 자료</h2><table><tr><th>자료</th><th>파일</th><th>등록 시각</th></tr>${Object.entries(DATA.meta).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v.name)}</td><td>${esc(v.at)}</td></tr>`).join('')}</table></div>`;
  h += `<div class="card"><h2>공용소재 그룹 (품목 ↔ 재고 ↔ 원소재 송장 연결표)</h2><div class="muted">코우타이 동합재고의 'ใช้ RM ร่วมกัน' 묶음과 PO 원소재 품번 기준. ※ 표시 그룹은 MAIL(인도) 품목과 소재를 같이 쓰므로 실제 여유가 화면보다 적을 수 있습니다.</div><table><tr><th>ID</th><th>그룹</th><th>발주서 품번</th><th>재고 품번</th><th>원소재 송장 품번</th></tr>${P.DEFAULT_GROUPS.map(g => `<tr><td>${g.id}</td><td>${esc(g.name)}</td><td>${g.items.join(', ')}</td><td>${g.stockPns.join(', ')}</td><td>${g.rmPns.join(', ')}</td></tr>`).join('')}</table></div>`;
  document.getElementById('t-files').innerHTML = h;
}
run();
</script>
</body>
</html>
