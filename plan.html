<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --ink:#15181d; --graphite:#1c2128; --paper:#f3f2ee; --paper-2:#ffffff;
  --amber:#e8892f; --amber-dim:#c76f1e;
  --run:#3f9d5e; --run-bg:#e3f3e6;
  --live:#2f6fed; --live-bg:#e4ecfd;
  --setup:#c98a1f; --setup-bg:#faf1de;
  --stop:#9aa0a8; --stop-bg:#eceae5;
  --filestop:#d5453a; --filestop-bg:#fbe5e3;
  --nodata:#c2beb4; --nodata-bg:#f5f3ee;
  --stale:#d5533f;
  --muted:#8b93a1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',monospace;}
.disp{font-family:'Space Grotesk',sans-serif;}

header{
  background:linear-gradient(180deg,var(--graphite),var(--ink));color:#fff;
  padding:16px 20px;position:sticky;top:0;z-index:10;
}
header .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
header h1{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0;}
header .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase;}
nav{display:flex;gap:6px;}
nav button{all:unset;cursor:pointer;padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;color:#c4cad3;border:1px solid #3a4453;}
nav button.active{background:var(--amber);color:#1c1200;border-color:var(--amber);}

#main{padding:20px;max-width:1400px;margin:0 auto;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;color:#555;align-items:center;}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
select,input[type=text],input[type=url]{font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:7px 10px;border-radius:7px;border:1px solid #d6d2c8;background:#fff;color:var(--ink);}
button.btn{font-family:'Noto Sans KR',sans-serif;font-weight:600;font-size:13px;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;background:var(--amber);color:#241600;}
button.btn:hover{background:var(--amber-dim);}
button.btn.ghost{background:transparent;border:1px solid #d6d2c8;color:#444;}
button.btn.ghost:hover{background:#efece5;}
button.btn.small{padding:6px 11px;font-size:12px;}

.bgroup{margin-bottom:26px;}
.bgroup h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 10px 0;display:flex;align-items:center;gap:8px;}
.bgroup h2 .cnt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#999;font-weight:400;}

.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.eq-card{
  border-radius:11px;padding:12px 13px;cursor:pointer;border:1.5px solid transparent;
  background:var(--nodata-bg);transition:transform .1s;
}
.eq-card:hover{transform:translateY(-1px);}
.eq-card.run{background:var(--run-bg);border-color:#bfe2c7;}
.eq-card.live{background:var(--live-bg);border-color:#b7c9f7;}
.eq-card.setup{background:var(--setup-bg);border-color:#ecd9a8;}
.eq-card.stop{background:var(--stop-bg);border-color:#d8d5cd;}
.eq-card.filestop{background:var(--filestop-bg);border-color:#eab3a8;}
.eq-card.nodata{background:var(--nodata-bg);border-color:#e3e0d8;}
.eq-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.eq-card .eqid{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;}
.eq-card .status-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;margin-top:3px;}
.status-dot.run{background:var(--run);}
.status-dot.live{background:var(--live);}
.status-dot.setup{background:var(--setup);}
.status-dot.stop{background:var(--stop);}
.status-dot.filestop{background:var(--filestop);}
.status-dot.nodata{background:var(--nodata);}
.eq-card .eqname{font-size:10.5px;color:#666;margin-bottom:6px;line-height:1.3;min-height:26px;}
.eq-card .prod{font-size:12px;font-weight:600;line-height:1.3;}
.eq-card .meta{font-size:10px;color:#999;margin-top:6px;font-family:'IBM Plex Mono',monospace;}
.eq-card .stale{color:var(--stale);font-weight:700;}


#toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
#toast.show{opacity:1;}
.hidden{display:none !important;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:#fff;border-radius:14px;padding:32px 28px;max-width:360px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08);}
.login-card h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 4px 0;}
.login-card .sub{font-size:12px;color:#8b93a1;margin-bottom:22px;font-family:'IBM Plex Mono',monospace;}
.login-card input{width:100%;padding:11px 13px;margin-bottom:12px;border-radius:8px;border:1px solid #d6d2c8;font-size:14px;}
.login-card button{width:100%;padding:12px;margin-top:6px;}
.login-err{color:var(--stale);font-size:12.5px;margin-top:10px;min-height:16px;}
.userbar{font-size:11px;color:#9aa3ad;display:flex;align-items:center;gap:8px;}
.userbar button{all:unset;cursor:pointer;color:var(--amber);text-decoration:underline;font-size:11px;}


.pf-upload-btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:#dd8a33;color:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:8px;border:0;box-shadow:0 2px 6px rgba(221,138,51,.4);transition:transform .08s,box-shadow .08s,background .08s;white-space:nowrap;}
.pf-upload-btn:hover{background:#c9772a;box-shadow:0 4px 10px rgba(201,119,42,.45);transform:translateY(-1px);}
.login-card .btn{width:100%;}
/* ===== [신규] 생산관리·경보 탭 (kp-*) — 기존 스타일과 분리 ===== */
.kp-card{background:#fff;border:1px solid #e3e1da;border-radius:12px;padding:14px 16px;margin-bottom:12px;}
.kp-up{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.kp-muted{color:#8b93a1;font-size:12px;}
.kp-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.kp-chip{border:1px solid #e3e1da;border-radius:14px;padding:4px 10px;font-size:11.5px;background:#faf9f6;color:#8b93a1;}
.kp-chip.ok{background:#e7f6ed;border-color:#bfe3cd;color:#2e9d5b;}
.kp-subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px 0;}
.kp-subnav button{all:unset;cursor:pointer;padding:7px 14px;border-radius:18px;font-size:12.5px;font-weight:600;color:#4a5260;background:#fff;border:1px solid #d9d6cc;}
.kp-subnav button.on{background:#2b3340;color:#fff;border-color:#2b3340;}
.kp-h{font-family:'Space Grotesk','Noto Sans KR',sans-serif;font-size:15px;margin:0 0 8px 0;}
.kp-h3{font-size:13.5px;margin:14px 0 6px 0;}
.kp-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;}
.kp-kpi{border-radius:11px;padding:12px 14px;border:1px solid #e3e1da;background:#fff;cursor:pointer;}
.kp-kpi b{display:block;font-size:26px;font-family:'Space Grotesk',sans-serif;}.kp-kpi span{font-size:11.5px;color:#8b93a1;}
.kp-kpi.r{background:#fbe5e3;border-color:#eab3a8;}.kp-kpi.r b{color:#d5453a;}
.kp-kpi.a{background:#faf1de;border-color:#ecd9a8;}.kp-kpi.a b{color:#b26a00;}
.kp-kpi.b{background:#e4ecfd;border-color:#b7c9f7;}.kp-kpi.b b{color:#2f6fed;}
.kp-al{border-left:4px solid #d5453a;background:#fbe5e3;padding:9px 12px;border-radius:6px;margin:6px 0;font-size:13px;line-height:1.6;}
.kp-al.a{border-color:#c98a1f;background:#faf1de;}.kp-al.b{border-color:#2f6fed;background:#e4ecfd;}
.kp-tw{max-height:560px;overflow:auto;border:1px solid #e3e1da;border-radius:8px;}
.kp-t{width:100%;border-collapse:collapse;font-size:12.5px;}
.kp-t th{background:#f7f6f2;text-align:left;font-weight:600;color:#7c8493;position:sticky;top:0;z-index:1;}
.kp-t th,.kp-t td{padding:6px 8px;border-bottom:1px solid #f0eee8;vertical-align:top;white-space:nowrap;}
.kp-t .n{text-align:right;font-variant-numeric:tabular-nums;}
.kp-t td.kp-nm{white-space:normal;min-width:230px;max-width:320px;}.kp-t td.kp-cz{white-space:normal;min-width:110px;max-width:150px;}
.kp-tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.kp-tag.t-AIR{background:#fbe5e3;color:#d5453a;}.kp-tag.t-CAP{background:#faf1de;color:#b26a00;}.kp-tag.t-RM{background:#e4ecfd;color:#2f6fed;}.kp-tag.t-OK{background:#e3f3e6;color:#3f9d5e;}
.kp-sets{display:flex;gap:12px;flex-wrap:wrap;}
.kp-f{display:flex;flex-direction:column;font-size:11.5px;color:#8b93a1;gap:4px;}
.kp-f input{padding:7px;border:1px solid #d6d2c8;border-radius:6px;font-size:13px;width:130px;}
.kp-note{background:#f7f6f2;border:1px solid #ece9e1;border-radius:8px;padding:8px 11px;font-size:12px;color:#4a5260;line-height:1.65;margin:8px 0;}
.kp-src{display:inline-block;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600;white-space:nowrap;}
.kp-src.k{background:#e3f3e6;color:#2e7d4f;}.kp-src.t{background:#faf1de;color:#a36500;}.kp-src.n{background:#eceae5;color:#7c8493;}
.kp-click{cursor:pointer;}.kp-click:hover td{background:#fbfaf6;}
.kp-grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;}@media(max-width:1100px){.kp-grid2{grid-template-columns:1fr;}}
.kp-ct{border:1px solid #ece9e1;border-radius:9px;padding:9px 11px;margin:8px 0;overflow:auto;}
.kp-f select{padding:7px;border:1px solid #d6d2c8;border-radius:6px;font-size:13px;}
.kp-t th{line-height:1.3;}

</style>
</head>

      <div class="userbar" id="userbar"></div>

</header>
<div id="main"></div>

<script>
// 가동현황판(index.html)과 같은 Firebase 프로젝트·같은 직원 계정을 씁니다. 이 페이지의 자료는 'planning/' 경로에만 저장됩니다.

let currentPage = 'plan';

// ==================== 생산관리 분석 엔진 ====================
/* KOWOO 종합 생산관리 분석 엔진 (브라우저/Node 공용)
 * 입력: SheetJS 워크북 (XLSX.read(..., {cellDates:true}))
 *  - 생산실적 (Productivity 월별, 설비별 시트)
 *  - 일자별 발주서 (한국→태국 주별 발송요청)
 *  - BALANCE STOCK (코우타이 재고: 동합재고 시트)
 *  - PO 파일 (invoice number-raw material: 원소재 해상 운송 ETD/ETA)
 * 출력: 결품·항공 경보, 원소재 발송 마감, 여유설비 제안, 일일 목표 대비 실적
 */
(function (root) {
  'use strict';
  const DAY = 86400000;
  const isNum = v => typeof v === 'number' && isFinite(v);
  const n = v => (isNum(v) ? v : 0);
  const s = v => (v == null ? '' : String(v)).replace(/\s+/g, ' ').trim();
  const toDate = v => {
    if (v instanceof Date) { const t = Math.round((v.getTime() - v.getTimezoneOffset() * 60000) / DAY) * DAY; const u = new Date(t); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate()); }
    if (isNum(v) && v > 30000 && v < 80000) return new Date(Math.round((v - 25569) * DAY) + new Date().getTimezoneOffset() * 60000);
    return null;
  };
  const addDays = (d, k) => new Date(d.getTime() + k * DAY);
  const ymd = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : '';
  const rows = (wb, name) => {
    const ws = wb.Sheets[name];
    if (!ws || !ws['!ref']) return [];
    const rg = root.XLSX.utils.decode_range(ws['!ref']); rg.s.c = 0; rg.s.r = 0;   // 항상 A1 기준 열번호
    return root.XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true, range: rg });
  };

  /* ---------- 기본 설정 ---------- */
  const DEFAULT_SETTINGS = {
    today: null,            // null이면 오늘
    seaLeadDays: 17,        // 한국 ETD → 코우타이 입고 (2026년 실측 중앙값 16~17일)
    koreaPrepDays: 0,       // 한국 공장 → ETD 까지 준비일
    prodLeadDays: 7,        // 원소재 입고 → 출하가능 (가공·검사·포장)
    wipLeadDays: 3,         // 재공품 → 출하가능
    shiftHours: 10.5,
    shiftsPerDay: 2,
    workDaysPerWeek: 6,
    idleDays: 7,            // 최근 N일 생산 0이면 여유설비
    targetQuantile: 0.75,   // 실적기준 목표 = 상위 25% 교대 속도
    underTargetRatio: 0.85, // 목표의 85% 미만이면 미달
    horizonWeeks: 10,
    minOpHours: 40,         // 작업자 판정 최소 작업시간
    lowOpRatio: 0.85,       // 전체 중앙값 대비 85% 미만 → 확인 필요
    highOpRatio: 1.15
  };

  /* 품목 → 공용소재 그룹 (코우타이 동합재고 'ใช้ RM ร่วมกัน' 묶음 + PO 원소재 품번 기준)
   * items: 일자별 발주서 품번, stockPns: 동합재고 품번(RM·WIP 합산), rmPns: 원소재 송장 품번,
   * cap: 생산실적에서 주간 생산능력을 읽을 항목 {item 정규식, process 정규식} */
  const DEFAULT_GROUPS = [
    { id: 'G01', name: 'NX4·KA4 MSCL/NON KEY (공용소재)', items: ['GL714N4000', 'GL714N4200', 'GL714R0000', 'GL714R0200'], stockPns: ['GL714N4000', 'GL714N4200', 'GL714R0000', 'GL714R0200'], rmPns: ['GL714N4000'], cap: { item: /^NX4 MSCL$/i, process: /CNC #20/i }, koreaCapaWeek: 24549, koreaCapaNote: 'NX4·KA4 CAPA표(250321) 선삭 6대 129.3초, 2교대×10.5h×7일' },
    { id: 'G02', name: "NX4·KA4 ESCL ASS'Y", items: ['GL714N4100', 'GL714R0100'], stockPns: ['GL714N4100', 'GL714R0100'], rmPns: ['GL714N4100'], cap: { item: /^NX4 ESCL$/i, process: /CNC#30-3/i } },
    { id: 'G03', name: 'GCI ESCL 공용소재 (HC/YB ETE·US4) ※MAIL 인도와 공용', items: ['GL714J2900', 'GL714A9700', 'GL714B1400', 'GL714J2700'], stockPns: ['GL714A8800', 'GM711A3100', 'GL714J2700', 'GL714J2900', 'GL714B1400', 'GL714A9700'], rmPns: ['GM711A3100'] },
    { id: 'G04', name: 'IB/GB 2900/3900 공용소재 (TL/QL N/K·HC/YB MTE) ※MAIL 인도와 공용', items: ['GL714A8701', 'GL714J2800', 'GL714J2810'], stockPns: ['GM711A2900', 'GM711A3900', 'GL714A8701', 'GL714J2800'], rmPns: ['GM711A2900'] },
    { id: 'G05', name: 'HC/YB MSCL TILT', items: ['GL714J2600'], stockPns: ['GL714J2600', 'GL714K3010'], rmPns: ['GL714J2600'] },
    { id: 'G06', name: 'AX S/U', items: ['GL714O6000'], stockPns: ['GL714O6000', 'GL714O6009'], rmPns: ['GL714O6000'] },
    { id: 'G07', name: 'Y450 MSCL', items: ['GL714B1200'], stockPns: ['GL714B1200'], rmPns: ['GL714B1200'] },
    { id: 'G08', name: 'Y450 ESCL', items: ['GL714B1300'], stockPns: ['GL714B1300'], rmPns: ['GL714B1300'] },
    { id: 'G09', name: 'RB C-MDPS', items: ['GM71133300'], stockPns: ['GM71133300'], rmPns: ['GM71133300'], cap: { item: /^RB C-MPDS$/i, process: /Key Hole/i } },
    { id: 'G10', name: 'X103 MSCL', items: ['GL714J5200'], stockPns: ['GL714J5200'], rmPns: ['GL714J5200'] },
    { id: 'G11', name: 'X103 ESCL', items: ['GL714J5300'], stockPns: ['GL714J5300'], rmPns: ['GL714J5300'] },
    { id: 'G12', name: 'C300 MSCL', items: ['GL714A3800'], stockPns: ['GL714A3800'], rmPns: ['GL714A3800'] },
    { id: 'G13', name: 'C300 ESCL', items: ['GL714A4800'], stockPns: ['GL714A4800'], rmPns: ['GL714A4800'] },
    { id: 'G14', name: 'X81C LHD', items: ['GA711A1300'], stockPns: ['GA711A1300'], rmPns: ['GA711A1300'] },
    { id: 'G15', name: 'X81C RHD', items: ['GA711A1100'], stockPns: ['GA711A1100'], rmPns: ['GA711A1100'] },
    { id: 'G16', name: 'PU 1.4 10P/J', items: ['GU825B1700'], stockPns: ['GU825B1700'], rmPns: ['GU825B1700'] },
    { id: 'G17', name: 'PU 4WD 내수 10P/J', items: ['GU83130300'], stockPns: ['GU83130300'], rmPns: ['GU83130300'] },
    { id: 'G18', name: 'PU 2WD 내수 10P/J', items: ['GU83131600'], stockPns: ['GU83131600'], rmPns: ['GU83131600'] },
    { id: 'G19', name: 'PU 2WD 수출 10P/J', items: ['GU83132500'], stockPns: ['GU83132500'], rmPns: ['GU83132500'] },
    { id: 'G20', name: 'PU 4WD 수출 10P/J', items: ['GU83132600'], stockPns: ['GU83132600'], rmPns: ['GU83132600'] },
    { id: 'G21', name: 'PU 2WD (RH KJ2.9) 10P/J', items: ['GU82534200'], stockPns: ['GU82534200'], rmPns: ['GU82534200'] }
  ];

  /* ---------- 파일 종류 판별 ---------- */
  function detectFileType(wb) {
    const names = wb.SheetNames;
    if (names.includes('일자별 발주서')) return 'shipPlan';
    if (names.includes('동합재고')) return 'stock';
    if (names.includes('invoice number-raw material') && names.includes('buy-back Korea')) return 'poInvoice';
    if (names.some(n => /생산 종합 현황/.test(n)) || names.some(n => /^(KWI|DH)-CL-/.test(n))) return 'productivity';
    const r = rows(wb, names[0]);
    if (names.some(n => { const r = rows(wb, n); return r.slice(0, 4).some(x => x && x.some(v => /C A P A/.test(s(v)))); })) return 'capa';
    return 'unknown';
  }

  /* ---------- 생산실적 ---------- */
  const PROD_SKIP = /^(F[123]\.|생산 종합 현황|생산현황|[123]\.(Press|CNC|HYD)|Item Data)/;
  function parseProductivity(wb) {
    let month = null;
    const sum = rows(wb, wb.SheetNames.find(n => n === '생산 종합 현황') || '');
    if (sum[1]) month = toDate(sum[1][3]);
    let bldg = 'F1';
    const recs = [];
    for (const name of wb.SheetNames) {
      if (/^F[123]\.$/.test(name)) bldg = name.slice(0, 2);
      if (PROD_SKIP.test(name)) continue;
      const R = rows(wb, name);
      for (let i = 1; i < R.length; i++) {
        const it = R[i];
        if (!it || it.length < 40) continue;
        if (!/qty/i.test(s(it[6])) || !/net/i.test(s(it[3]))) continue;
        const op = R[i - 1] || [];
        const find = (col, re) => { for (let k = i; k < Math.min(i + 9, R.length); k++) { if (R[k] && re.test(s(R[k][col]))) return R[k]; } return null; };
        const cap = find(6, /^capa/i), hrs = find(5, /^working hours/i), ng = find(6, /^ng p/i);
        const eff = R[i + 2] && isNum(R[i + 2][4]) ? R[i + 2][4] : null; // Work Efficiency 행
        for (let d = 0; d < 31; d++) {
          const c = 8 + d, q = it[c], h = hrs ? hrs[c] : null;
          if ((isNum(q) && q > 0) || (isNum(h) && h > 0)) {
            recs.push({
              month: month ? ymd(month).slice(0, 7) : '', bldg, machine: name,
              item: s(it[0]), shift: s(it[1]), process: s(it[2]), netct: isNum(it[4]) ? it[4] : null, eff,
              day: d + 1, date: month ? addDays(month, d) : null, operator: s(op[c]),
              qty: n(q), hours: n(h), capa: cap ? n(cap[c]) : 0, ng: ng ? n(ng[c]) : 0
            });
          }
        }
      }
    }
    // 이상치 표시
    for (const r of recs) r.bad = r.hours > 12 || /^\d+$/.test(r.operator);
    return { month: month ? ymd(month) : null, machines: [...new Set(recs.map(r => r.machine))], allSheets: wb.SheetNames.filter(n => !PROD_SKIP.test(n)), records: recs };
  }

  /* ---------- 일자별 발주서 ---------- */
  function parseShipPlan(wb) {
    const R = rows(wb, '일자별 발주서');
    const hdr = R[1] || [];
    const cols = [];
    for (let j = 16; j < hdr.length; j++) { const d = toDate(hdr[j]); if (d && j >= 24) cols.push([j, d]); }
    const items = [];
    for (let i = 2; i < R.length - 1; i++) {
      const a = R[i];
      if (!a || s(a[14]) !== '발주수량') continue;
      const b = R[i + 1] || [];
      const pn = s(a[4]) || s(a[1]);
      if (!pn) continue;
      items.push({
        pn, thPn: s(a[5]), name: s(a[6]) || s(a[3]), rmPn: s(a[7]), cls: s(a[15]), mean6: n(a[22]),
        weeks: cols.map(([j, d]) => ({ date: d, req: n(a[j]), ship: n(b[j]) }))
      });
    }
    return { weeks: cols.map(c => c[1]), items };
  }

  /* ---------- 코우타이 재고 (동합재고) ---------- */
  function parseStock(wb) {
    const R = rows(wb, '동합재고');
    const title = s((R[0] || [])[0]);
    const out = [];
    for (let i = 3; i < R.length; i++) {
      const r = R[i];
      if (!r || !s(r[1])) continue;
      out.push({ name: s(r[1]), pn: s(r[2]), onboard: n(r[5]), rm: n(r[6]) + n(r[7]), wipPD: n(r[8]), wipPK: n(r[9]), hold: n(r[10]), wipWH: n(r[11]), wip: n(r[12]), fg: n(r[13]) + n(r[14]), shared: /ร่วม/.test(s(r[3])) });
    }
    return { title, rows: out };
  }

  /* ---------- PO 파일: 원소재 해상운송 ---------- */
  function parsePOInvoice(wb) {
    const R = rows(wb, 'invoice number-raw material');
    const list = [];
    for (let i = 7; i < R.length; i++) {
      const r = R[i];
      if (!r || !s(r[1])) continue;
      const etd = toDate(r[8]), eta = toDate(r[14]);
      if (!etd) continue;
      list.push({ inv: s(r[1]), pn: s(r[2]), item: s(r[3]), qty: n(r[4]), etd, etaPort: toDate(r[11]), eta, status: s(r[15]).toLowerCase() });
    }
    const lt = list.filter(x => x.eta && x.etd.getFullYear() >= new Date().getFullYear() - 1).map(x => (x.eta - x.etd) / DAY).filter(x => x > 0 && x < 40).sort((a, b) => a - b);
    const med = lt.length ? lt[Math.floor(lt.length / 2)] : null;
    return { list, onboard: list.filter(x => x.status === 'on board'), leadMedian: med, leadSamples: lt.length };
  }


  /* ---------- 한국 CAPA 조사표 ---------- */
  function parseCapa(wb, fileName) {
    const fd = (String(fileName || '').match(/(\d{6})(?!\d)/g) || []).pop() || '';
    const out = [];
    for (const sheet of wb.SheetNames) {
      const R = rows(wb, sheet);
      if (!R.slice(0, 4).some(x => x && x.some(v => /C A P A/.test(s(v))))) continue;
      let off = 0;
      R.slice(0, 10).forEach(r => (r || []).forEach((v, j) => { if (s(v) === '설비C/T') off = j - 6; }));
      const line = s((R[2] || [])[3]) || s(fileName);
      const idx = [];
      for (let i = 8; i < R.length; i++) { const r = R[i] || []; if (s(r[1]) && isNum(r[9 + off])) idx.push(i); }
      idx.forEach((i, ix) => {
        const r = R[i], end = idx[ix + 1] || R.length;
        const machines = [], products = [];
        for (let k = i; k < end; k++) {
          const rr = R[k] || [];
          const o = s(rr[14 + off]); if (o && !/^(소계|부하율)$/.test(o)) products.push(o);
          if (off === 0 && k > i && /CL-\d+/i.test(s(rr[5])) && isNum(rr[6])) machines.push({ id: s(rr[5]).toUpperCase(), ct: rr[6], lu: n(rr[7]) });
        }
        const eff = n(r[8 + off]) || 1;
        out.push({ id: [fileName, sheet, s(r[0]), s(r[1])].join('|'), file: fileName, fileDate: fd, sheet, line,
          no: s(r[0]), process: s(r[1]), equip: s(r[2]), type: s(r[3]), qtyMc: n(r[4]),
          netCt: n(r[6 + off]), lu: n(r[7 + off]), eff, stdCt: n(r[9 + off]), machines, products: [...new Set(products)] });
      });
    }
    return { fileName, fileDate: fd, rows: out };
  }
  const tokens = line => s(line).toUpperCase().split(/[\s,·/+()]+/).filter(t => t.length >= 2 && !/^(LINE|S\/U|가공|외|종)$/.test(t));
  function makeStdResolver(capaRows, manual) {
    const byId = {}; capaRows.forEach(r => { byId[r.id] = r; });
    const newest = (a, b) => (b.fileDate || '').localeCompare(a.fileDate || '');
    return function (machine, item, process, r0) {
      const key = machine + '|' + item + '|' + process;
      const M = machine.toUpperCase(), I = item.toUpperCase();
      const mk = (row, ct, src) => ({ stdCt: ct, source: src, ref: row ? `${row.line} · ${row.no} ${row.process} (${row.file})` : '', rowId: row ? row.id : '' });
      const mm = manual[key];
      if (mm && byId[mm]) {
        const row = byId[mm]; const m = row.machines.find(x => M.endsWith(x.id.replace(/^.*?(CL-\d+)$/, '$1')));
        return mk(row, m ? (m.ct + m.lu) / row.eff : row.stdCt, '한국 CAPA (지정)');
      }
      const lineOk = row => tokens(row.line).some(t => I.includes(t));
      const ex = capaRows.filter(row => lineOk(row) && row.machines.some(x => M.endsWith(x.id.replace(/^.*?(CL-\d+)$/, '$1')))).sort(newest)[0];
      if (ex) { const m = ex.machines.find(x => M.endsWith(x.id.replace(/^.*?(CL-\d+)$/, '$1'))); return mk(ex, (m.ct + m.lu) / ex.eff, '한국 CAPA (설비번호 일치)'); }
      const pm = capaRows.filter(row => lineOk(row) && /^#\d+/.test(row.no) && new RegExp(row.no.replace('#', '#\\s*') + '(?!\\d)').test(process)).sort(newest)[0];
      if (pm) return mk(pm, pm.stdCt, '한국 CAPA (라인·공정 일치)');
      if (r0 && r0.netct && r0.eff) return { stdCt: r0.netct / r0.eff, source: '코우타이 파일 C/T (임시)', ref: `Net C/T ${r0.netct}초 ÷ 효율 ${Math.round(r0.eff * 100)}%`, rowId: '' };
      return { stdCt: null, source: '기준 없음', ref: '', rowId: '' };
    };
  }
  /* ---------- 누적 실적 vs 누적 목표 (기간) ---------- */
  function cumulative(prod, from, to, S) {
    S = Object.assign({}, DEFAULT_SETTINGS, S || {});
    const inR = prod.filter(r => r.date && r.date >= from && r.date <= to);
    const days = [...new Set(inR.map(r => +r.date))].sort((a, b) => a - b);
    const availH = days.length * S.shiftsPerDay * S.shiftHours;
    const mach = {};
    for (const r of inR) {
      const m = mach[r.machine] = mach[r.machine] || { machine: r.machine, bldg: r.bldg, qty: 0, target: 0, noStd: 0, shiftH: {}, lines: {}, daily: {} };
      m.qty += r.qty;
      if (r.targetQty != null) m.target += r.targetQty; else m.noStd += r.qty;
      const sk = +r.date + '|' + r.shift; m.shiftH[sk] = Math.max(m.shiftH[sk] || 0, r.hours);
      const lk = r.item + '|' + r.process;
      const L = m.lines[lk] = m.lines[lk] || { item: r.item, process: r.process, qty: 0, target: 0, hours: 0, source: r.std ? r.std.source : '', stdCt: r.std ? r.std.stdCt : null };
      L.qty += r.qty; L.hours += r.hours; if (r.targetQty != null) L.target += r.targetQty;
      const d = m.daily[+r.date] = m.daily[+r.date] || { qty: 0, target: 0 }; d.qty += r.qty; if (r.targetQty != null) d.target += r.targetQty;
    }
    const list = Object.values(mach).map(m => {
      const hours = Object.values(m.shiftH).reduce((a, b) => a + b, 0);
      const mixRate = hours ? m.target / hours : 0;          // 실제 품목구성 기준 시간당 목표(개/h)
      let cq = 0, ct = 0;
      const daily = days.map(d => { const x = m.daily[d] || { qty: 0, target: 0 }; cq += x.qty; ct += x.target; return { date: new Date(d), qty: x.qty, target: x.target, cumQty: cq, cumTarget: ct }; });
      return { machine: m.machine, bldg: m.bldg, products: Object.keys(m.lines).length, qty: m.qty, target: m.target, ratio: m.target ? m.qty / m.target : null,
        hours, availH, util: availH ? hours / availH : null, capaAvail: mixRate * availH, ratioAvail: mixRate ? m.qty / (mixRate * availH) : null, noStdQty: m.noStd,
        lines: Object.values(m.lines).map(L => Object.assign(L, { ratio: L.target ? L.qty / L.target : null })), daily };
    }).sort((a, b) => (a.ratio == null ? 9 : a.ratio) - (b.ratio == null ? 9 : b.ratio));
    return { from, to, days: days.length, availH, machines: list };
  }


  /* ---------- 작업자 비교 (기준 C/T로 환산 → 설비·품목이 달라도 공정하게 비교) ---------- */
  const OP_ALIAS = {Chanuporon:'Chanuporn',Dawkamol:'Daokamol',Jerdchai:'Jeadchai',Kassarin:'Kassarinda',Orachorn:'Orachon',Pichit:'Phichit',Pimphakan:'Pimpakan',Rapipat:'Raphipat',Sakomwan:'Sakolwan',Sakonwan:'Sakolwan',Sitthipathon:'Suthipathon',Suthiphathon:'Suthipathon',Suphachai:'Supachai',Thiradat:'Thiradet',Wantha:'Wanta',Yodchay:'Yodchai',Peereya:'Peeraya',Apitsara:'Aphitsara',Naruamon:'Naruemon',Sijitta:'Sujitta'};
  function operatorStats(prod, from, to, S) {
    S = Object.assign({}, DEFAULT_SETTINGS, S || {});
    const recs = prod.filter(r => r.date && r.date >= from && r.date <= to && r.targetQty != null && r.targetQty > 0 && r.hours >= 2 && r.operator && !/[+,]/.test(r.operator) && !/^\d+$/.test(r.operator) && r.operator !== '`');
    recs.forEach(r => { r.op = OP_ALIAS[r.operator] || r.operator; });
    const last = recs.reduce((m, r) => (!m || r.date > m ? r.date : m), null);
    const ops = {};
    for (const r of recs) {
      const o = ops[r.op] = ops[r.op] || { operator: r.op, qty: 0, target: 0, shifts: new Set(), machines: {}, bldg: {}, daily: {}, lastQty: 0, lastTarget: 0 };
      o.qty += r.qty; o.target += r.targetQty; o.shifts.add(+r.date + r.shift);
      o.machines[r.machine] = (o.machines[r.machine] || 0) + r.hours; o.bldg[r.bldg] = (o.bldg[r.bldg] || 0) + 1;
      const d = o.daily[+r.date] = o.daily[+r.date] || { qty: 0, target: 0 }; d.qty += r.qty; d.target += r.targetQty;
      if (+r.date === +last) { o.lastQty += r.qty; o.lastTarget += r.targetQty; }
    }
    // 시간: 교대별 최대(같은 교대에 여러 품목 블록이 있어도 중복 합산 안 함)
    const sh = {}; recs.forEach(r => { const k = r.op + '|' + (+r.date) + '|' + r.shift; sh[k] = Math.max(sh[k] || 0, r.hours); });
    const list = Object.values(ops).map(o => {
      const hours = Object.entries(sh).filter(([k]) => k.startsWith(o.operator + '|')).reduce((a, [, v]) => a + v, 0);
      let cq = 0, ct = 0;
      const daily = Object.keys(o.daily).map(Number).sort((a, b) => a - b).map(d => { const x = o.daily[d]; cq += x.qty; ct += x.target; return { date: new Date(d), qty: x.qty, target: x.target, ratio: x.qty / x.target, cumRatio: cq / ct }; });
      return { operator: o.operator, bldg: Object.entries(o.bldg).sort((a, b) => b[1] - a[1])[0][0], shifts: o.shifts.size, hours, qty: o.qty, target: o.target, ratio: o.qty / o.target,
        lastRatio: o.lastTarget ? o.lastQty / o.lastTarget : null, lastQty: o.lastQty, lastTarget: o.lastTarget,
        machines: Object.entries(o.machines).sort((a, b) => b[1] - a[1]).map(x => x[0]), daily };
    });
    const ok = list.filter(o => o.hours >= S.minOpHours).map(o => o.ratio).sort((a, b) => a - b);
    const med = ok.length ? ok[Math.floor(ok.length / 2)] : 1;
    list.forEach(o => { o.vsMed = o.ratio / med; o.flag = o.hours < S.minOpHours ? '표본부족' : (o.vsMed < S.lowOpRatio ? '확인 필요' : o.vsMed > S.highOpRatio ? '우수' : '보통'); });
    list.sort((a, b) => a.ratio - b.ratio);
    // 동일 C/T 그룹: 기준 C/T(초)가 같은 공정끼리 작업자 비교
    const groups = {};
    for (const r of recs) {
      const ct = Math.round(r.std.stdCt * 10) / 10, k = ct + '|' + r.std.source;
      const g = groups[k] = groups[k] || { stdCt: ct, source: r.std.source, procs: new Set(), ops: {} };
      g.procs.add(r.machine + ' ' + r.item + ' ' + r.process);
      const o = g.ops[r.op] = g.ops[r.op] || { operator: r.op, qty: 0, target: 0, hours: 0, shifts: 0, days: {} };
      o.qty += r.qty; o.target += r.targetQty; o.hours += r.hours; o.shifts++;
      o.days[+r.date] = (o.days[+r.date] || 0) + r.qty;
    }
    const ctGroups = Object.values(groups).map(g => {
      const arr = Object.values(g.ops).map(o => Object.assign(o, { ratio: o.qty / o.target, perShift: o.qty / o.shifts, perHour: o.qty / o.hours }));
      const m = arr.map(o => o.ratio).sort((a, b) => a - b)[Math.floor(arr.length / 2)];
      arr.forEach(o => { o.vsMed = o.ratio / m; });
      return { stdCt: g.stdCt, source: g.source, procs: [...g.procs], ops: arr.sort((a, b) => b.ratio - a.ratio), spread: arr.length > 1 ? arr[0].ratio / arr[arr.length - 1].ratio : 1 };
    }).filter(g => g.ops.length >= 2).sort((a, b) => b.spread - a.spread);
    return { from, to, last, median: med, operators: list, ctGroups };
  }

  /* ---------- 분석 ---------- */
  function analyze(data, settingsIn, groupsIn) {
    const S = Object.assign({}, DEFAULT_SETTINGS, settingsIn || {});
    const groups = groupsIn || DEFAULT_GROUPS;
    const today = S.today ? toDate(S.today instanceof Date ? S.today : new Date(S.today)) : toDate(new Date());
    const out = { today, settings: S, shortage: [], rmPlan: [], spare: [], targets: [], underTarget: [], notes: [] };
    const prod = data.productivity ? [].concat(...data.productivity.map(p => p.records)).filter(r => !r.bad) : [];
    const lastProdDate = prod.reduce((m, r) => (r.date && (!m || r.date > m) ? r.date : m), null);

    /* --- 1. 표준(한국 CAPA 조사표) 연결 · 일일/누적 목표 --- */
    const capaRows = data.capa ? [].concat(...data.capa.map(c => c.rows)) : [];
    const stdOf = makeStdResolver(capaRows, data.capaMap || {});
    out.capaRows = capaRows;
    const quant = (a, q) => { const b = [...a].sort((x, y) => x - y); const p = (b.length - 1) * q, lo = Math.floor(p); return b[lo] + (b[Math.min(lo + 1, b.length - 1)] - b[lo]) * (p - lo); };
    const grp = {};
    for (const r of prod) { const k = r.machine + '|' + r.item + '|' + r.process; (grp[k] = grp[k] || []).push(r); }
    for (const [k, list] of Object.entries(grp)) {
      const [machine, item, process] = k.split('|');
      const r0 = list[0];
      const st = stdOf(machine, item, process, r0);
      for (const r of list) { r.std = st; r.targetQty = st.stdCt ? r.hours * 3600 / st.stdCt : null; }
      const valid = list.filter(r => r.hours >= 2 && r.qty > 0);
      const rates = valid.map(r => r.qty / r.hours);
      const thaiStd = r0.netct && r0.eff ? r0.netct / r0.eff : null;
      out.targets.push({ key: k, machine, bldg: r0.bldg, item, process, n: valid.length,
        qty: list.reduce((a, r) => a + r.qty, 0), hours: list.reduce((a, r) => a + r.hours, 0),
        stdCt: st.stdCt, source: st.source, ref: st.ref, rowId: st.rowId || '',
        targetRate: st.stdCt ? 3600 / st.stdCt : null, targetShift: st.stdCt ? Math.round(3600 / st.stdCt * S.shiftHours) : null,
        actRate: rates.length ? rates.reduce((a, b) => a + b, 0) / rates.length : null, p75Rate: rates.length ? quant(rates, 0.75) : null,
        thaiCt: thaiStd, thaiShiftCapa: thaiStd ? Math.round(3600 / thaiStd * S.shiftHours) : null });
    }
    out.targets.sort((a, b) => a.bldg.localeCompare(b.bldg) || a.machine.localeCompare(b.machine) || a.item.localeCompare(b.item));
    out.lastProdDate = lastProdDate;
    // 전일 점검: 설비·교대 단위 (한 설비가 여러 품목·공정을 한 경우 묶어서 합산)
    if (lastProdDate) {
      const byMS = {};
      for (const r of prod.filter(x => +x.date === +lastProdDate)) { const k = r.machine + '|' + r.shift; (byMS[k] = byMS[k] || []).push(r); }
      for (const [k, list] of Object.entries(byMS)) {
        const [machine, shift] = k.split('|');
        const tq = list.reduce((a, r) => a + (r.targetQty || 0), 0), aq = list.reduce((a, r) => a + r.qty, 0);
        const hasStd = list.every(r => r.targetQty != null);
        const hrs = Math.max(...list.map(r => r.hours));
        const ratio = tq ? aq / tq : null;
        out.underTarget.push({ date: lastProdDate, machine, bldg: list[0].bldg, shift, hours: hrs, qty: aq, target: tq, ratio, hasStd,
          operators: [...new Set(list.map(r => r.operator).filter(Boolean))].join(', '), under: ratio != null && ratio < S.underTargetRatio,
          lines: list.map(r => ({ item: r.item, process: r.process, qty: r.qty, hours: r.hours, target: r.targetQty, ratio: r.targetQty ? r.qty / r.targetQty : null, source: r.std.source, operator: r.operator })) });
      }
      out.underTarget.sort((a, b) => (a.ratio == null ? 9 : a.ratio) - (b.ratio == null ? 9 : b.ratio));
    }
    out.prod = prod;
    /* --- 2. 설비 가동 현황 → 여유설비 --- */
    const machineAll = new Set([].concat(...(data.productivity || []).map(p => p.allSheets)));
    const lastRun = {}, procOfMachine = {};
    for (const r of prod) {

        if (level === 'OK' && /생산능력/.test(cause)) { level = 'CAP'; action = '증산 필요 (여유설비 제안 참고)'; }

    const dates = R.prod.map(r=>+r.date).filter(Boolean); const minD = new Date(Math.min(...dates)), maxD = new Date(Math.max(...dates));
    if(!KP.to) KP.to = P.ymd(maxD); if(!KP.from){ const f = new Date(maxD.getFullYear(), maxD.getMonth(), 1); KP.from = P.ymd(f < minD ? minD : f); }
    const O = P.operatorStats(R.prod, day0(KP.from), day0(KP.to), S);
    const ops = O.operators.filter(o=>!KP.bldg || o.bldg===KP.bldg);
    const flagTag = f => `<span class="kp-tag ${f==='확인 필요'?'t-AIR':f==='우수'?'t-OK':f==='보통'?'t-RM':''}">${f}</span>`;
    let h = `<div class="kp-card"><h2 class="kp-h">작업자 비교 — 일일·누적 (기준 C/T로 환산)</h2>
      <div class="kp-sets" style="align-items:flex-end">
        <label class="kp-f">시작일<input type="date" id="kpFrom" value="${KP.from}" min="${P.ymd(minD)}" max="${P.ymd(maxD)}"></label>
        <label class="kp-f">종료일<input type="date" id="kpTo" value="${KP.to}" min="${P.ymd(minD)}" max="${P.ymd(maxD)}"></label>
        <label class="kp-f">동 (주 근무동)<select id="kpBldg"><option value="">전체</option>${['F1','F2','F3'].map(b=>`<option ${KP.bldg===b?'selected':''}>${b}</option>`).join('')}</select></label>
      </div>
      <div class="kp-note">설비·품목마다 속도가 달라 개수만으로는 비교가 안 되므로, 각 교대 실적을 <b>그 공정의 기준 C/T로 계산한 목표</b>(= 기준 C/T 시간당 목표 × 작업시간)로 나눈 <b>달성률</b>로 비교합니다. 100% = 기준 속도대로 일함.
      '전체 중앙값 대비'가 ${Math.round(S.lowOpRatio*100)}% 미만이면 '확인 필요', ${Math.round(S.highOpRatio*100)}% 초과면 '우수' (작업시간 ${S.minOpHours}h 미만은 표본부족).
      <b>판정 전 현장 확인:</b> 설비 고장·자재 대기·작업시간 기재 습관도 달성률에 영향을 줍니다. 기준이 '임시(코우타이 C/T)'인 공정은 CAPA 기준표에서 한국 CAPA로 연결하면 더 정확해집니다. 2인 공동 기재(A+B)와 숫자만 적힌 작업자 칸은 제외했습니다.</div>
      <div class="kp-muted">기간 중앙값 달성률 <b>${Math.round(O.median*100)}%</b> · 비교 대상 ${ops.length}명 · 마지막 실적일 ${d8(O.last)} · 이름을 누르면 일자별 추이가 펼쳐집니다.</div>
      <div class="kp-tw" style="max-height:560px"><table class="kp-t"><tr><th>판정</th><th>작업자</th><th>주 근무동</th><th class="n">근무 교대<br>(회)</th><th class="n">작업시간<br>(h)</th><th class="n">누적 실적<br>(개)</th><th class="n">누적 목표<br>(개, 기준C/T×작업시간)</th><th class="n">누적 달성률<br>(%)</th><th class="n">전체 중앙값 대비<br>(%)</th><th class="n">${d8(O.last)} 일일 달성률<br>(%)</th><th>주로 일한 설비</th></tr>`;
    for(const o of ops){
      const op = KP.opOpen[o.operator];
      h += `<tr class="kp-click" data-o="${esc(o.operator)}"><td>${flagTag(o.flag)}</td><td><b>${op?'▾':'▸'} ${esc(o.operator)}</b></td><td>${o.bldg}</td><td class="n">${o.shifts}</td><td class="n">${o.hours.toFixed(1)}</td><td class="n">${fmt(o.qty)}</td><td class="n">${fmt(o.target)}</td><td class="n">${pct(o.ratio)}</td><td class="n">${Math.round(o.vsMed*100)}%</td><td class="n">${o.lastRatio!=null?pct(o.lastRatio):'<span class="kp-muted">근무 없음</span>'}</td><td class="kp-nm kp-muted">${esc(o.machines.slice(0,4).join(', '))}</td></tr>`;
      if(op) h += `<tr><td></td><td colspan="10" style="background:#faf9f6"><table class="kp-t" style="width:auto"><tr><th>일자</th><th class="n">일 실적<br>(개)</th><th class="n">일 목표<br>(개)</th><th class="n">일 달성률<br>(%)</th><th class="n">누적 달성률<br>(%)</th></tr>${o.daily.map(d=>`<tr><td>${d8(d.date)}</td><td class="n">${fmt(d.qty)}</td><td class="n">${fmt(d.target)}</td><td class="n">${pct(d.ratio)}</td><td class="n">${pct(d.cumRatio)}</td></tr>`).join('')}</table></td></tr>`;
    }
    h += '</table></div></div>';
    h += `<div class="kp-card"><h2 class="kp-h">같은 기준 C/T 공정끼리 작업자 비교 (설비는 달라도 C/T가 같으면 같은 조건)</h2>
      <div class="kp-note">기준 C/T(초/개)가 같은 공정을 묶어, 그 공정들을 한 작업자들의 실적을 나란히 놓았습니다. 같은 C/T에서 교대당 수량 차이가 크면 작업 속도·휴식·대기 차이를 의심해 볼 수 있습니다. 편차가 큰 그룹부터 보여줍니다. 그룹을 누르면 포함된 설비·공정 목록이 보입니다.</div>`;
    for(const g of O.ctGroups){
      const op = KP.ctOpen[g.stdCt+g.source];
      h += `<div class="kp-ct"><div class="kp-click" data-ct="${esc(g.stdCt+g.source)}"><b>${op?'▾':'▸'} 기준 C/T ${g.stdCt}초/개</b> ${srcTag(g.source)} <span class="kp-muted">· 공정 ${g.procs.length}개 · 작업자 ${g.ops.length}명 · 최고/최저 달성률 ${g.spread.toFixed(1)}배</span></div>
        ${op?`<div class="kp-muted" style="margin:4px 0 6px;white-space:normal">${esc(g.procs.join(' / '))}</div>`:''}
        <table class="kp-t" style="width:auto;min-width:640px"><tr><th>작업자</th><th class="n">근무 교대<br>(회)</th><th class="n">작업시간<br>(h)</th><th class="n">실적<br>(개)</th><th class="n">교대당 평균<br>(개/교대)</th><th class="n">시간당<br>(개/h)</th><th class="n">달성률<br>(%)</th><th class="n">그룹 중앙값 대비<br>(%)</th></tr>
        ${g.ops.map(o=>`<tr><td>${esc(o.operator)}</td><td class="n">${o.shifts}</td><td class="n">${o.hours.toFixed(1)}</td><td class="n">${fmt(o.qty)}</td><td class="n">${fmt(o.perShift)}</td><td class="n">${o.perHour.toFixed(1)}</td><td class="n">${pct(o.ratio)}</td><td class="n" style="color:${o.vsMed<S.lowOpRatio?'#d5453a':o.vsMed>S.highOpRatio?'#2e9d5b':''}">${Math.round(o.vsMed*100)}%</td></tr>`).join('')}</table></div>`;
    }
    body.innerHTML = h + '</div>';
    const re = ()=>window.renderPlan(main);
    body.querySelector('#kpFrom').onchange = e=>{ KP.from = e.target.value; re(); };
    body.querySelector('#kpTo').onchange = e=>{ KP.to = e.target.value; re(); };
    body.querySelector('#kpBldg').onchange = e=>{ KP.bldg = e.target.value; re(); };
    body.querySelectorAll('tr.kp-click[data-o]').forEach(tr=>tr.onclick = ()=>{ const o = tr.dataset.o; KP.opOpen[o] = !KP.opOpen[o]; re(); });
    body.querySelectorAll('div.kp-click[data-ct]').forEach(d=>d.onclick = ()=>{ const k = d.dataset.ct; KP.ctOpen[k] = !KP.ctOpen[k]; re(); });
  }

  function kpStd(body, main){
    const R = KP.result, S = KP.S;
    const rowsC = R.capaRows || [];
    const cnt = {}; R.targets.forEach(t=>cnt[t.source]=(cnt[t.source]||0)+1);
    const toks = s => String(s||'').toUpperCase().split(/[\s,·/+()]+/).filter(x=>x.length>=2);
    const opts = t => { const I = t.item.toUpperCase();
      const scored = rowsC.map(r=>({r, s: toks(r.line).some(x=>I.includes(x)) || r.products.some(p=>toks(p).some(x=>x.length>=3 && I.includes(x))) ? 1 : 0}))
        .sort((a,b)=>b.s-a.s || (b.r.fileDate||'').localeCompare(a.r.fileDate||''));
      return `<option value="">— 한국 CAPA 공정 선택 —</option>` + scored.map(({r,s})=>`<option value="${esc(r.id)}" ${t.rowId===r.id && /지정/.test(t.source)?'selected':''}>${s?'★ ':''}[${r.fileDate}] ${esc(r.line)} · ${esc(r.no)} ${esc(r.process)} · 표준 ${r.stdCt.toFixed(1)}초</option>`).join(''); };
    let h = `<div class="kp-card"><h2 class="kp-h">CAPA 기준표 — 설비·품목·공정별 기준 C/T와 1교대 목표수량</h2>
      <div class="kp-note">목표의 기준은 <b>한국 CAPA 조사표</b>입니다. 조사표를 '자료 등록'에서 올리면 설비번호가 같은 곳(예: NA5 KWI-CL-100)과 라인·공정번호가 같은 곳은 자동 연결됩니다. 나머지는 오른쪽 칸에서 해당 CAPA 공정을 골라 주세요(★ = 품목명이 조사표 라인·차종과 일치). 고른 내용은 모든 사용자에게 공유되고, 일일·누적 목표가 즉시 다시 계산됩니다.<br>
      현재: ${Object.entries(cnt).map(([k,v])=>`${srcTag(k)} ${v}건`).join(' · ')} · 한국 CAPA 조사표 ${Object.keys(KP.data.capa).length}개 등록</div>
      <div class="kp-tw" style="max-height:640px"><table class="kp-t"><tr><th>동</th><th>설비</th><th>품목</th><th>공정</th><th class="n">기준 C/T<br>(초/개)</th><th>기준 출처</th><th class="n">시간당 목표<br>(개/h)</th><th class="n">1교대 목표<br>(개/${S.shiftHours}h)</th><th class="n">실적 평균 속도<br>(개/h)</th><th class="n">실적 ÷ 목표<br>(%)</th><th class="n">코우타이 파일 기준<br>1교대 CAPA (개)</th><th>한국 CAPA 연결 (선택)</th></tr>` +
      R.targets.map(t=>`<tr><td>${t.bldg}</td><td>${esc(t.machine)}</td><td>${esc(t.item)}</td><td>${esc(t.process)}</td><td class="n">${t.stdCt?t.stdCt.toFixed(1):'-'}</td><td>${srcTag(t.source)}<div class="kp-muted" style="max-width:260px;white-space:normal">${esc(t.ref)}</div></td><td class="n">${t.targetRate?t.targetRate.toFixed(1):'-'}</td><td class="n"><b>${fmt(t.targetShift)}</b></td><td class="n">${t.actRate?t.actRate.toFixed(1):'-'}</td><td class="n">${t.actRate&&t.targetRate?pct(t.actRate/t.targetRate):''}</td><td class="n kp-muted">${fmt(t.thaiShiftCapa)}</td><td><select class="kp-map" data-k="${esc(t.key)}" style="max-width:320px">${opts(t)}</select></td></tr>`).join('') + '</table></div></div>';
    body.innerHTML = h;
    body.querySelectorAll('select.kp-map').forEach(sel=>sel.onchange = async ()=>{
      const k = sel.dataset.k; if(sel.value) KP.capaMap[k] = sel.value; else delete KP.capaMap[k];
      await kpSave('capaMap/'+kpKey(k), sel.value ? {key:k, rowId:sel.value, by:who(), at:Date.now()} : null);
      toast(sel.value ? '한국 CAPA 기준을 연결했습니다.' : '연결을 해제했습니다.'); window.renderPlan(main);
    });
  }

  function kpFiles(body, main){
    const S = KP.settings;
    const f = (k,lbl,step)=>`<label class="kp-f">${lbl}<input type="number" step="${step||1}" data-k="${k}" value="${S[k]}"></label>`;
    let h = `<div class="kp-card"><h2 class="kp-h">계산 기준 (모든 사용자 공통으로 저장됩니다)</h2><div class="kp-sets">
      <label class="kp-f">기준일 (비우면 오늘)<input type="date" data-k="today" value="${S.today||''}"></label>
      ${f('seaLeadDays','해상 ETD→코우타이 입고 (일)')}${f('koreaPrepDays','한국 준비일 (공장→ETD)')}${f('prodLeadDays','원소재→출하가능 (일)')}${f('wipLeadDays','재공→출하가능 (일)')}
      ${f('shiftHours','1교대 시간',0.5)}${f('workDaysPerWeek','주 가동일')}${f('idleDays','여유설비 판정 (일)')}${f('underTargetRatio','일일 미달 기준 (0~1)',0.05)}${f('minOpHours','작업자 판정 최소 작업시간 (h)')}${f('lowOpRatio','작업자 확인필요 기준 (0~1)',0.05)}${f('highOpRatio','작업자 우수 기준',0.05)}
      </div><div class="kp-muted" style="margin-top:8px">해상 리드타임은 PO 파일을 등록하면 원소재 송장 ${KP.data.poInvoice?KP.data.poInvoice.leadSamples+'건의 ':''}실측 중앙값으로 자동 설정됩니다.</div></div>`;
    h += `<div class="kp-card"><h2 class="kp-h">등록된 자료</h2><table class="kp-t"><tr><th>자료</th><th>파일</th><th>등록자</th><th>등록 시각</th></tr>${Object.entries(KP.meta).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v.fileName)}</td><td>${esc(v.uploadedBy)}</td><td>${v.uploadedAt?new Date(v.uploadedAt).toLocaleString():''}</td></tr>`).join('')}</table></div>`;
    h += `<div class="kp-card"><h2 class="kp-h">공용소재 그룹 (발주서 품번 ↔ 재고 품번 ↔ 원소재 송장 품번)</h2><div class="kp-muted">코우타이 동합재고의 'ใช้ RM ร่วมกัน' 묶음과 PO 원소재 품번 기준. ※ 그룹은 MAIL(인도) 품목과 소재를 같이 쓰므로 실제 여유가 화면보다 적을 수 있습니다.</div><div class="kp-tw" style="max-height:360px"><table class="kp-t"><tr><th>ID</th><th>그룹</th><th>발주서 품번</th><th>재고 품번</th><th>원소재 송장 품번</th></tr>${P.DEFAULT_GROUPS.map(g=>`<tr><td>${g.id}</td><td>${esc(g.name)}</td><td>${g.items.join(', ')}</td><td>${g.stockPns.join(', ')}</td><td>${g.rmPns.join(', ')}</td></tr>`).join('')}</table></div></div>`;
    body.innerHTML = h;
    body.querySelectorAll('[data-k]').forEach(inp=>inp.onchange = async ()=>{
      const k = inp.dataset.k; S[k] = k==='today' ? inp.value : +inp.value;
      await kpSave('settings', S); toast('계산 기준을 저장했습니다.'); window.renderPlan(main);
    });
  }
})();


function renderLogin(){
  document.getElementById('userbar').innerHTML='';
  document.getElementById('main').innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <h1>KOWOO 생산관리·경보</h1>
      <div class="sub">가동현황판과 같은 직원 계정으로 로그인해주세요</div>
      <input type="email" id="loginEmail" placeholder="이메일" autocomplete="username">
      <input type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password">
      <button class="btn" id="loginBtn">로그인</button>
      <div class="login-err" id="loginErr"></div>
    </div></div>`;
  const doLogin = async ()=>{
    const email=document.getElementById('loginEmail').value.trim(), pw=document.getElementById('loginPw').value, err=document.getElementById('loginErr');
    err.textContent='';
    if(!email||!pw){ err.textContent='이메일과 비밀번호를 입력해주세요.'; return; }
    try{ await auth.signInWithEmailAndPassword(email, pw); }catch(e){ err.textContent='로그인 실패: 이메일 또는 비밀번호를 확인해주세요.'; }
  };
  document.getElementById('loginBtn').onclick=doLogin;
  document.getElementById('loginPw').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
}
function renderUserbar(){
  document.getElementById('userbar').innerHTML = `<span>${currentUser.email}</span><button id="logoutBtn">로그아웃</button>`;
  document.getElementById('logoutBtn').onclick = ()=>auth.signOut();
}
async function render(){
  if(!FIREBASE_CONFIGURED){ document.getElementById('main').innerHTML='<div class="kp-card">Firebase 설정이 필요합니다.</div>'; return; }
  if(!currentUser){ renderLogin(); return; }
  renderUserbar();
  await renderPlan(document.getElementById('main'));
}
if(FIREBASE_CONFIGURED) auth.onAuthStateChanged(u=>{ currentUser=u; render(); }); else render();
</script>
</body>
</html>
